<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extrator Grid Fixo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #000;
            color: #fff;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 { text-align: center; margin-bottom: 20px; color: #ff0000; }
        
        #upload-area {
            background: #111;
            border: 3px dashed #ff0000;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 20px;
        }
        #file-input { display: none; }
        #preview {
            max-width: 100%;
            max-height: 300px;
            margin: 20px auto;
            display: none;
            border-radius: 8px;
            border: 2px solid #ff0000;
        }
        #canvasProcessada {
            max-width: 100%;
            margin: 20px auto;
            display: none;
            border-radius: 8px;
            border: 2px solid #00ff00;
        }
        #canvas { display: none; }
        
        button {
            width: 100%;
            padding: 18px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px 0;
        }
        #btnExtrair { background: #ff0000; display: none; }
        #btnCopiar { background: #00aa00; display: none; }
        
        #status {
            text-align: center;
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
            font-weight: bold;
            display: none;
        }
        #status.sucesso { background: #27ae60; display: block; }
        #status.erro { background: #e74c3c; display: block; }
        #status.info { background: #f39c12; color: #000; display: block; }
        
        #resultado {
            background: #111;
            border: 2px solid #ff0000;
            border-radius: 8px;
            padding: 15px;
            min-height: 100px;
            font-size: 18px;
            line-height: 1.8;
            word-break: break-all;
            display: none;
            color: #ff0000;
            font-weight: bold;
        }
        
     .info {
            background: #111;
            padding: 12px;
            border-radius: 8px;
            margin: 15px 0;
            font-size: 14px;
            text-align: center;
            border: 1px solid #ff0000;
        }
    </style>
</head>
<body>
    <h1>🔴 Extrator V15.1 - Grid Fixo</h1>
    
    <div class="info">
        V15.1 - Bug do [object Object] corrigido. Margem do grid ajustada.
    </div>
    
    <div id="upload-area">
        <div style="font-size: 48px; margin-bottom: 10px;">📁</div>
        <div style="font-size: 18px; font-weight: bold;">Manda print da tela inteira</div>
        <div style="font-size: 14px; color: #aaa; margin-top: 8px;">Grid 4x5 fixo no fundo laranja</div>
    </div>
    
    <input type="file" id="file-input" accept="image/*">
    <img id="preview">
    <canvas id="canvas"></canvas>
    <canvas id="canvasProcessada"></canvas>
    
    <button id="btnExtrair">🔍 Extrair Números</button>
    
    <div id="status"></div>
    
    <div id="resultado"></div>
    <button id="btnCopiar">📋 Copiar Números</button>

    <script>
        const uploadArea = document.getElementById('upload-area');
        const fileInput = document.getElementById('file-input');
        const preview = document.getElementById('preview');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const canvasProcessada = document.getElementById('canvasProcessada');
        const ctxProc = canvasProcessada.getContext('2d');
        const btnExtrair = document.getElementById('btnExtrair');
        const status = document.getElementById('status');
        const resultado = document.getElementById('resultado');
        const btnCopiar = document.getElementById('btnCopiar');
        
        let numerosExtraidos = '';
        
        uploadArea.addEventListener('click', () => fileInput.click());
        
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (e) => {
                preview.src = e.target.result;
                preview.style.display = 'block';
                btnExtrair.style.display = 'block';
                canvasProcessada.style.display = 'none';
                resultado.style.display = 'none';
                btnCopiar.style.display = 'none';
                status.style.display = 'none';
            };
            reader.readAsDataURL(file);
        });
        
        // CORRIGIDO: agora retorna o dígito certo
        function matchDigit(pattern) {
            const templates = {
                '01110100011000101110': '0',
                '00100010001000100010': '1', 
                '111000010011100010111': '2',
                '111000010011100001111': '3',
                '1001010010111100100': '4',
                '111101000011100001111': '5',
                '01110100001111010111': '6',
                '11100010001000100010': '7',
                '01110101001110101110': '8',
                '01110101001110001110': '9',
                '0111010001100010111': '0',
                '0100010001000100010': '1'
            };
            
            let bestMatch = '?';
            let bestScore = 0;
            for (let tmpl in templates) {
                let len = Math.min(tmpl.length, pattern.length);
                if (len < 12) continue;
                let score = 0;
                for (let i = 0; i < len; i++) {
                    if (pattern[i] === tmpl[i]) score++;
                }
                score = score / len;
                if (score > bestScore && score >= 0.6) {
                    bestScore = score;
                    bestMatch = templates[tmpl]; // CORRIGIDO AQUI
                }
            }
            return bestMatch;
        }
        
        function isLaranjaTexto(r, g, b) {
            return r > 120 && g > 40 && g < 210 && b < 160 && (r - g) > 5 && (r - b) > 30;
        }
        
        function isLaranjaFundo(r, g, b) {
            return r > 170 && g > 70 && g < 170 && b < 110;
        }
        
        btnExtrair.addEventListener('click', () => {
            status.className = 'info';
            status.innerText = 'Procurando retângulo laranja...';
            
            const img = new Image();
            img.onload = () => {
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);
                let imgData = ctx.getImageData(0, 0, img.width, img.height);
                let data = imgData.data;
                
                // 1. Acha o maior retângulo laranja de fundo
                let minX = img.width, maxX = 0, minY = img.height, maxY = 0;
                let achouFundo = false;
                
                for (let y = 0; y < img.height; y++) {
                    for (let x = 0; x < img.width; x++) {
                        let i = (y * img.width + x) * 4;
                        let r = data[i], g = data[i+1], b = data[i+2];
                        if (isLaranjaFundo(r, g, b)) {
                            achouFundo = true;
                            minX = Math.min(minX, x);
                            maxX = Math.max(maxX, x);
                            minY = Math.min(minY, y);
                            maxY = Math.max(maxY, y);
                        }
                    }
                }
                
                if (!achouFundo) {
                    status.className = 'erro';
                    status.innerText = '❌ Não achei fundo laranja na imagem';
                    return;
                }
                
                let rectW = maxX - minX;
                let rectH = maxY - minY;
                
                if (rectW < 200 || rectH < 200) {
                    status.className = 'erro';
                    status.innerText = '❌ Retângulo laranja muito pequeno';
                    return;
                }
                
                status.className = 'info';
                status.innerText = 'Dividindo em grid 4x5 e lendo...';
                
                // 2. Processa visual
                canvasProcessada.width = rectW;
                canvasProcessada.height = rectH;
                let outputData = ctxProc.createImageData(rectW, rectH);
                let out = outputData.data;
                
                let numeros = [];
                let gridX = 4, gridY = 5;
                let cellW = rectW / gridX;
                let cellH = rectH / gridY;
                
                // CORRIGIDO: margem menor, de 8% só
                for (let row = 0; row < gridY; row++) {
                    for (let col = 0; col < gridX; col++) {
                        let startX = Math.floor(minX + col * cellW + cellW * 0.08);
                        let endX = Math.floor(minX + (col + 1) * cellW - cellW * 0.08);
                        let startY = Math.floor(minY + row * cellH + cellH * 0.08);
                        let endY = Math.floor(minY + (row + 1) * cellH - cellH * 0.08);
                        
                        let temTexto = false;
                        let digitBounds = {minX: endX, maxX: startX, minY: endY, maxY: startY};
                        
                        for (let y = startY; y < endY; y++) {
                            for (let x = startX; x < endX; x++) {
                                let i = (y * img.width + x) * 4;
                                let oi = ((y - minY) * rectW + (x - minX)) * 4;
                                let r = data[i], g = data[i+1], b = data[i+2];
                                
                                if (isLaranjaTexto(r, g, b)) {
                                    temTexto = true;
                                    out[oi] = 255; out[oi+1] = 0; out[oi+2] = 0; out[oi+3] = 255;
                                    digitBounds.minX = Math.min(digitBounds.minX, x);
                                    digitBounds.maxX = Math.max(digitBounds.maxX, x);
                                    digitBounds.minY = Math.min(digitBounds.minY, y);
                                    digitBounds.maxY = Math.max(digitBounds.maxY, y);
                                } else if (r > 180 && g > 180 && b > 180) {
                                    out[oi] = 255; out[oi+1] = 255; out[oi+2] = 255; out[oi+3] = 255;
                                } else {
                                    out[oi] = 0; out[oi+1] = 0; out[oi+2] = 0; out[oi+3] = 255;
                                }
                            }
                        }
                        
                        if (temTexto) {
                            let dW = digitBounds.maxX - digitBounds.minX;
                            let dH = digitBounds.maxY - digitBounds.minY;
                            if (dW < 3 || dH < 5) continue;
                            
                            if (dW > dH * 0.6) {
                                let p1 = '', p2 = '';
                                for (let r = 0; r < 5; r++) {
                                    for (let c = 0; c < 5; c++) {
                                        let px1 = Math.floor(digitBounds.minX + c * dW / 10);
                                        let px2 = Math.floor(digitBounds.minX + dW/2 + c * dW / 10);
                                        let py = Math.floor(digitBounds.minY + r * dH / 5);
                                        let i1 = (py * img.width + px1) * 4;
                                        let i2 = (py * img.width + px2) * 4;
                                        p1 += isLaranjaTexto(data[i1], data[i1+1], data[i1+2])? '1' : '0';
                                        p2 += isLaranjaTexto(data[i2], data[i2+1], data[i2+2])? '1' : '0';
                                    }
                                }
                                let d1 = matchDigit(p1);
                                let d2 = matchDigit(p2);
                                if (d1!== '?' && d2!== '?') numeros.push(d1 + d2);
                            } else {
                                let pattern = '';
                                for (let r = 0; r < 5; r++) {
                                    for (let c = 0; c < 5; c++) {
                                        let px = Math.floor(digitBounds.minX + c * dW / 5);
                                        let py = Math.floor(digitBounds.minY + r * dH / 5);
                                        let i = (py * img.width + px) * 4;
                                        pattern += isLaranjaTexto(data[i], data[i+1], data[i+2])? '1' : '0';
                                    }
                                }
                                let d = matchDigit(pattern);
                                if (d!== '?') numeros.push('0' + d);
                            }
                        }
                    }
                }
                
                ctxProc.putImageData(outputData, 0, 0);
                canvasProcessada.style.display = 'block';
                
                if (numeros.length === 0) {
                    status.className = 'erro';
                    status.innerText = '❌ Não achei números laranja no grid';
                    return;
                }
                
                numerosExtraidos = numeros.sort((a,b) => parseInt(a) - parseInt(b)).join(', ');
                resultado.innerText = numerosExtraidos;
                resultado.style.display = 'block';
                btnCopiar.style.display = 'block';
                
                status.className = 'sucesso';
                status.innerText = `✅ ${numeros.length} números extraídos!`;
            };
            img.src = preview.src;
        });
        
        btnCopiar.addEventListener('click', () => {
            navigator.clipboard.writeText(numerosExtraidos);
            btnCopiar.innerText = '✅ Copiado!';
            setTimeout(() => {
                btnCopiar.innerText = '📋 Copiar Números';
            }, 2000);
        });
    </script>
</body>
</html>
