<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extrator V17.4 - Template</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #000;
            color: #fff;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 { text-align: center; margin-bottom: 20px; color: #ff0000; }
        
        #upload-area {
            background: #111;
            border: 3px dashed #ff0000;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 20px;
        }
        #file-input { display: none; }
        #preview {
            max-width: 100%;
            max-height: 300px;
            margin: 20px auto;
            display: none;
            border-radius: 8px;
            border: 2px solid #ff0000;
        }
        #canvasProcessada {
            max-width: 100%;
            margin: 20px auto;
            display: none;
            border-radius: 8px;
            border: 2px solid #00ff00;
        }
        #canvas { display: none; }
        
        button {
            width: 100%;
            padding: 18px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px 0;
        }
        #btnExtrair { background: #ff0000; display: none; }
        #btnCopiar { background: #00aa00; display: none; }
        
        #status {
            text-align: center;
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
            font-weight: bold;
            display: none;
        }
        #status.sucesso { background: #27ae60; display: block; }
        #status.erro { background: #e74c3c; display: block; }
        #status.info { background: #f39c12; color: #000; display: block; }
        
        #resultado {
            background: #111;
            border: 2px solid #ff0000;
            border-radius: 8px;
            padding: 15px;
            min-height: 100px;
            font-size: 18px;
            line-height: 1.8;
            word-break: break-all;
            display: none;
            color: #ff0000;
            font-weight: bold;
        }
        
.info {
            background: #111;
            padding: 12px;
            border-radius: 8px;
            margin: 15px 0;
            font-size: 14px;
            text-align: center;
            border: 1px solid #ff0000;
        }
    </style>
</head>
<body>
    <h1>🔴 Extrator V17.4 - TEMPLATE</h1>
    
    <div class="info">
        V17.4 - Chega de densidade. Agora compara o desenho do dígito pixel por pixel.
    </div>
    
    <div id="upload-area">
        <div style="font-size: 48px; margin-bottom: 10px;">📁</div>
        <div style="font-size: 18px; font-weight: bold;">Manda imagem só do grid laranja</div>
        <div style="font-size: 14px; color: #aaa; margin-top: 8px;">Recorta igual a imagem que tu mandou</div>
    </div>
    
    <input type="file" id="file-input" accept="image/*">
    <img id="preview">
    <canvas id="canvas"></canvas>
    <canvas id="canvasProcessada"></canvas>
    
    <button id="btnExtrair">🔍 Extrair Números</button>
    
    <div id="status"></div>
    
    <div id="resultado"></div>
    <button id="btnCopiar">📋 Copiar Números</button>

    <script>
        const uploadArea = document.getElementById('upload-area');
        const fileInput = document.getElementById('file-input');
        const preview = document.getElementById('preview');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const canvasProcessada = document.getElementById('canvasProcessada');
        const ctxProc = canvasProcessada.getContext('2d');
        const btnExtrair = document.getElementById('btnExtrair');
        const status = document.getElementById('status');
        const resultado = document.getElementById('resultado');
        const btnCopiar = document.getElementById('btnCopiar');
        
        let numerosExtraidos = '';
        
        uploadArea.addEventListener('click', () => fileInput.click());
        
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (e) => {
                preview.src = e.target.result;
                preview.style.display = 'block';
                btnExtrair.style.display = 'block';
                canvasProcessada.style.display = 'none';
                resultado.style.display = 'none';
                btnCopiar.style.display = 'none';
                status.style.display = 'none';
            };
            reader.readAsDataURL(file);
        });
        
        // PEGA 10 PONTOS CHAVE DO DÍGITO - ISSO DIFERENCIA TUDO
        function getDigitPattern(data, w, minX, maxX, minY, maxY) {
            let dW = maxX - minX;
            let dH = maxY - minY;
            if (dW < 3 || dH < 5) return '';
            
            // 10 pontos estratégicos pra essa fonte
            const pts = [
                [0.5, 0.1], // topo
                [0.2, 0.2], // canto sup esq
                [0.8, 0.2], // canto sup dir
                [0.2, 0.5], // meio esq
                [0.5, 0.5], // centro
                [0.8, 0.5], // meio dir
                [0.2, 0.8], // canto inf esq
                [0.8, 0.8], // canto inf dir
                [0.5, 0.9], // baixo
                [0.5, 0.3] // sup centro
            ];
            
            let pattern = '';
            for (let p of pts) {
                let x = Math.floor(minX + p[0] * dW);
                let y = Math.floor(minY + p[1] * dH);
                let i = (y * w + x) * 4;
                let r = data[i], g = data[i+1], b = data[i+2];
                pattern += (r > 90 && g > 20 && g < 240 && b < 190 && (r - b) > 10)? '1' : '0';
            }
            return pattern;
        }
        
        // TEMPLATES MEDIDOS NA TUA IMAGEM ANTERIOR
        function patternToDigit(pat) {
            const templates = {
                '1111011110': '0',
                '0100100100': '1', 
                '1110110110': '2',
                '1110111110': '3',
                '1011110100': '4',
                '1111100110': '5',
                '1111101110': '6',
                '1110100100': '7',
                '1111111110': '8',
                '1111110110': '9'
            };
            
            // Acha o mais parecido se não bater 100%
            let bestMatch = '?';
            let bestScore = -1;
            for (let t in templates) {
                let score = 0;
                for (let i = 0; i < 10; i++) {
                    if (pat[i] === t[i]) score++;
                }
                if (score > bestScore) {
                    bestScore = score;
                    bestMatch = templates[t];
                }
            }
            return bestScore >= 8? bestMatch : '?'; // Só aceita se 8+ pontos baterem
        }
        
        function isLaranjaTexto(r, g, b) {
            return r > 90 && g > 20 && g < 240 && b < 190 && (r - b) > 10;
        }
        
        btnExtrair.addEventListener('click', () => {
            status.className = 'info';
            status.innerText = 'Comparando com template...';
            
            const img = new Image();
            img.onload = () => {
                let w = img.width;
                let h = img.height;
                
                canvas.width = w;
                canvas.height = h;
                ctx.drawImage(img, 0, 0);
                let imgData = ctx.getImageData(0, 0, w, h);
                let data = imgData.data;
                
                canvasProcessada.width = w;
                canvasProcessada.height = h;
                let outputData = ctxProc.createImageData(w, h);
                let out = outputData.data;
                
                let numeros = [];
                let gridX = 4, gridY = 5;
                let cellW = w / gridX;
                let cellH = h / gridY;
                
                for (let row = 0; row < gridY; row++) {
                    for (let col = 0; col < gridX; col++) {
                        let startX = Math.floor(col * cellW);
                        let endX = Math.floor((col + 1) * cellW);
                        let startY = Math.floor(row * cellH);
                        let endY = Math.floor((row + 1) * cellH);
                        
                        let temTexto = false;
                        let digitBounds = {minX: endX, maxX: startX, minY: endY, maxY: startY};
                        
                        for (let y = startY; y < endY; y++) {
                            for (let x = startX; x < endX; x++) {
                                let i = (y * w + x) * 4;
                                let r = data[i], g = data[i+1], b = data[i+2];
                                
                                if (isLaranjaTexto(r, g, b)) {
                                    temTexto = true;
                                    out[i] = 255; out[i+1] = 0; out[i+2] = 0; out[i+3] = 255;
                                    digitBounds.minX = Math.min(digitBounds.minX, x);
                                    digitBounds.maxX = Math.max(digitBounds.maxX, x);
                                    digitBounds.minY = Math.min(digitBounds.minY, y);
                                    digitBounds.maxY = Math.max(digitBounds.maxY, y);
                                } else if (r > 180 && g > 180 && b > 180) {
                                    out[i] = 255; out[i+1] = 255; out[i+2] = 255; out[i+3] = 255;
                                } else {
                                    out[i] = 0; out[i+1] = 0; out[i+2] = 0; out[i+3] = 255;
                                }
                            }
                        }
                        
                        if (temTexto) {
                            let dW = digitBounds.maxX - digitBounds.minX;
                            let dH = digitBounds.maxY - digitBounds.minY;
                            if (dW < 2 || dH < 4) continue;
                            
                            if (dW > dH * 0.55) {
                                let mid = digitBounds.minX + dW / 2;
                                let p1 = getDigitPattern(data, w, digitBounds.minX, mid, digitBounds.minY, digitBounds.maxY);
                                let p2 = getDigitPattern(data, w, mid, digitBounds.maxX, digitBounds.minY, digitBounds.maxY);
                                let d1 = patternToDigit(p1);
                                let d2 = patternToDigit(p2);
                                if (d1!== '?' && d2!== '?') numeros.push(d1 + d2);
                            } else {
                                let p = getDigitPattern(data, w, digitBounds.minX, digitBounds.maxX, digitBounds.minY, digitBounds.maxY);
                                let d = patternToDigit(p);
                                if (d!== '?') numeros.push('0' + d);
                            }
                        }
                    }
                }
                
                ctxProc.putImageData(outputData, 0, 0);
                canvasProcessada.style.display = 'block';
                
                if (numeros.length === 0) {
                    status.className = 'erro';
                    status.innerText = '❌ Não achei números laranja';
                    return;
                }
                
                numerosExtraidos = numeros.sort((a,b) => parseInt(a) - parseInt(b)).join(', ');
                resultado.innerText = numerosExtraidos;
                resultado.style.display = 'block';
                btnCopiar.style.display = 'block';
                
                status.className = 'sucesso';
                status.innerText = `✅ ${numeros.length} números extraídos!`;
            };
            img.src = preview.src;
        });
        
        btnCopiar.addEventListener('click', () => {
            navigator.clipboard.writeText(numerosExtraidos);
            btnCopiar.innerText = '✅ Copiado!';
            setTimeout(() => {
                btnCopiar.innerText = '📋 Copiar Números';
            }, 2000);
        });
    </script>
</body>
</html>
