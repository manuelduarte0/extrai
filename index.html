<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extrator de Números</title>
    <script src='https://unpkg.com/tesseract.js@4.1.1/dist/tesseract.min.js'></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #0a0a0a;
            color: #fff;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 { text-align: center; margin-bottom: 20px; color: #ff0000; }
        
        #upload-area {
            background: #1a1a1a;
            border: 3px dashed #ff0000;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 20px;
        }
        #file-input { display: none; }
        #preview {
            max-width: 100%;
            max-height: 400px;
            margin: 20px auto;
            display: none;
            border-radius: 8px;
            border: 2px solid #ff0000;
        }
        #canvas { display: none; }
        #canvasProcessada {
            max-width: 100%;
            margin: 20px auto;
            display: none;
            border-radius: 8px;
            border: 2px solid #00ff00;
        }
        
        button {
            width: 100%;
            padding: 18px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px 0;
        }
        #btnProcessar { background: #ff8800; display: none; }
        #btnExtrair { background: #ff0000; display: none; }
        #btnCopiar { background: #00aa00; display: none; }
        
        #status {
            text-align: center;
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
            font-weight: bold;
            display: none;
        }
        #status.sucesso { background: #27ae60; display: block; }
        #status.erro { background: #e74c3c; display: block; }
        #status.info { background: #f39c12; color: #000; display: block; }
        
        #resultado {
            background: #1a1a1a;
            border: 2px solid #ff0000;
            border-radius: 8px;
            padding: 15px;
            min-height: 100px;
            font-size: 16px;
            line-height: 1.8;
            word-break: break-all;
            display: none;
        }
        
.info {
            background: #1a1a1a;
            padding: 12px;
            border-radius: 8px;
            margin: 15px 0;
            font-size: 14px;
            text-align: center;
            border: 1px solid #ff0000;
        }
    </style>
</head>
<body>
    <h1>🔴 Extrator Padrão Preto/Vermelho</h1>
    
    <div class="info">
        V9.0 - Converte pra fundo PRETO, bolinha BRANCA, número VERMELHO. OCR real.
    </div>
    
    <div id="upload-area">
        <div style="font-size: 48px; margin-bottom: 10px;">📁</div>
        <div style="font-size: 18px; font-weight: bold;">Envia o print do quadrado laranja</div>
        <div style="font-size: 14px; color: #aaa; margin-top: 8px;">Corta só o quadrado laranja</div>
    </div>
    
    <input type="file" id="file-input" accept="image/*">
    <img id="preview">
    <canvas id="canvas"></canvas>
    <canvas id="canvasProcessada"></canvas>
    
    <button id="btnProcessar">1️⃣ Processar Imagem</button>
    <button id="btnExtrair">2️⃣ Extrair Números</button>
    
    <div id="status"></div>
    
    <div id="resultado"></div>
    <button id="btnCopiar">📋 Copiar Números</button>

    <script>
        const uploadArea = document.getElementById('upload-area');
        const fileInput = document.getElementById('file-input');
        const preview = document.getElementById('preview');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const canvasProcessada = document.getElementById('canvasProcessada');
        const ctxProc = canvasProcessada.getContext('2d');
        const btnProcessar = document.getElementById('btnProcessar');
        const btnExtrair = document.getElementById('btnExtrair');
        const status = document.getElementById('status');
        const resultado = document.getElementById('resultado');
        const btnCopiar = document.getElementById('btnCopiar');
        
        let numerosExtraidos = '';
        let worker = null;
        
        // Inicia Tesseract
        async function initOCR() {
            status.className = 'info';
            status.innerText = 'Carregando OCR...';
            try {
                worker = await Tesseract.createWorker('eng');
                await worker.setParameters({
                    tessedit_char_whitelist: '0123456789',
                    tessedit_pageseg_mode: Tesseract.PSM.SINGLE_BLOCK
                });
                status.style.display = 'none';
            } catch (e) {
                status.className = 'erro';
                status.innerText = '❌ Erro ao carregar OCR';
            }
        }
        initOCR();
        
        uploadArea.addEventListener('click', () => fileInput.click());
        
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (e) => {
                preview.src = e.target.result;
                preview.style.display = 'block';
                btnProcessar.style.display = 'block';
                btnExtrair.style.display = 'none';
                canvasProcessada.style.display = 'none';
                resultado.style.display = 'none';
                btnCopiar.style.display = 'none';
                status.style.display = 'none';
            };
            reader.readAsDataURL(file);
        });
        
        // PASSO 1: Processa imagem pra padrão preto/branco/vermelho
        btnProcessar.addEventListener('click', () => {
            status.className = 'info';
            status.innerText = 'Convertendo pra padrão preto/vermelho...';
            
            const img = new Image();
            img.onload = () => {
                // Tamanho fixo 400x500
                let w = 400;
                let h = 500;
                
                canvas.width = w;
                canvas.height = h;
                ctx.drawImage(img, 0, 0, w, h);
                
                canvasProcessada.width = w;
                canvasProcessada.height = h;
                
                let imageData = ctx.getImageData(0, 0, w, h);
                let data = imageData.data;
                let outputData = ctxProc.createImageData(w, h);
                let out = outputData.data;
                
                for (let i = 0; i < data.length; i += 4) {
                    let r = data[i];
                    let g = data[i + 1];
                    let b = data[i + 2];
                    
                    // Detecta laranja do número: R alto, G médio, B baixo
                    let ehLaranja = r > 180 && g > 80 && g < 200 && b < 120;
                    
                    // Detecta branco do círculo: tudo alto
                    let ehBranco = r > 200 && g > 200 && b > 200;
                    
                    if (ehLaranja) {
                        // Número laranja vira VERMELHO PURO
                        out[i] = 255; // R
                        out[i + 1] = 0; // G
                        out[i + 2] = 0; // B
                        out[i + 3] = 255; // A
                    } else if (ehBranco) {
                        // Círculo branco fica BRANCO PURO
                        out[i] = 255;
                        out[i + 1] = 255;
                        out[i + 2] = 255;
                        out[i + 3] = 255;
                    } else {
                        // Fundo laranja vira PRETO PURO
                        out[i] = 0;
                        out[i + 1] = 0;
                        out[i + 2] = 0;
                        out[i + 3] = 255;
                    }
                }
                
                ctxProc.putImageData(outputData, 0, 0);
                canvasProcessada.style.display = 'block';
                btnExtrair.style.display = 'block';
                
                status.className = 'sucesso';
                status.innerText = '✅ Imagem processada! Agora clica em Extrair';
            };
            img.src = preview.src;
        });
        
        // PASSO 2: Extrai números vermelhos com OCR
        btnExtrair.addEventListener('click', async () => {
            if (!worker) {
                status.className = 'erro';
                status.innerText = '❌ OCR não carregou. Recarrega a página.';
                return;
            }
            
            status.className = 'info';
            status.innerText = 'Lendo números vermelhos...';
            
            try {
                const { data: { text } } = await worker.recognize(canvasProcessada);
                
                // Pega todos números de 1 ou 2 dígitos
                const numeros = text.match(/\d{1,2}/g);
                
                if (!numeros || numeros.length === 0) {
                    status.className = 'erro';
                    status.innerText = '❌ Não achei números. Tenta cortar melhor a imagem.';
                    return;
                }
                
                // Remove duplicatas, formata 00-99, ordena
                let numerosUnicos = [...new Set(numeros)]
                   .map(n => n.padStart(2, '0'))
                   .filter(n => parseInt(n) >= 0 && parseInt(n) <= 99)
                   .sort((a,b) => parseInt(a) - parseInt(b));
                
                numerosExtraidos = numerosUnicos.join(', ');
                resultado.innerText = numerosExtraidos;
                resultado.style.display = 'block';
                btnCopiar.style.display = 'block';
                
                status.className = 'sucesso';
                status.innerText = `✅ ${numerosUnicos.length} números encontrados!`;
                
            } catch (error) {
                status.className = 'erro';
                status.innerText = '❌ Erro no OCR: ' + error.message;
            }
        });
        
        btnCopiar.addEventListener('click', () => {
            navigator.clipboard.writeText(numerosExtraidos);
            btnCopiar.innerText = '✅ Copiado!';
            setTimeout(() => {
                btnCopiar.innerText = '📋 Copiar Números';
            }, 2000);
        });
    </script>
</body>
</html>
