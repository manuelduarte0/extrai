<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extrator de Números de Imagem</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            color: #fff;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 { text-align: center; margin-bottom: 20px; color: #e94560; }
        
        #upload-area {
            background: #16213e;
            border: 3px dashed #0f3460;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 20px;
        }
        #file-input { display: none; }
        #preview {
            max-width: 100%;
            max-height: 400px;
            margin: 20px auto;
            display: none;
            border-radius: 8px;
            border: 2px solid #0f3460;
        }
        #canvas { display: none; }
        
        button {
            width: 100%;
            padding: 18px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px 0;
        }
        #btnExtrair { background: #e94560; display: none; }
        #btnExtrair:active { background: #c73e54; }
        #btnCopiar { background: #0f3460; display: none; }
        
        #status {
            text-align: center;
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
            font-weight: bold;
            display: none;
        }
        #status.sucesso { background: #27ae60; display: block; }
        #status.erro { background: #e74c3c; display: block; }
        #status.info { background: #f39c12; color: #000; display: block; }
        
        #resultado {
            background: #16213e;
            border: 2px solid #0f3460;
            border-radius: 8px;
            padding: 15px;
            min-height: 150px;
            font-size: 16px;
            line-height: 1.8;
            word-break: break-all;
            display: none;
        }
        
  .info {
            background: #0f3460;
            padding: 12px;
            border-radius: 8px;
            margin: 15px 0;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>📸 Extrair Números de Imagem</h1>
    
    <div class="info">
        V5.0 - Sem OCR. Detecta círculos brancos e lê números laranjas. Funciona offline.
    </div>
    
    <div id="upload-area" onclick="document.getElementById('file-input').click()">
        <div style="font-size: 48px; margin-bottom: 10px;">📁</div>
        <div style="font-size: 18px; font-weight: bold;">Clique aqui pra enviar a imagem</div>
        <div style="font-size: 14px; color: #aaa; margin-top: 8px;">PNG, JPG, JPEG</div>
    </div>
    
    <input type="file" id="file-input" accept="image/*">
    <img id="preview">
    <canvas id="canvas"></canvas>
    
    <button id="btnExtrair" onclick="extrairNumeros()">🔍 Extrair Números</button>
    
    <div id="status"></div>
    
    <div id="resultado"></div>
    <button id="btnCopiar" onclick="copiar()">📋 Copiar Números</button>

    <script>
        let imagemCarregada = null;
        let numerosExtraidos = '';
        
        const uploadArea = document.getElementById('upload-area');
        const fileInput = document.getElementById('file-input');
        const preview = document.getElementById('preview');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const btnExtrair = document.getElementById('btnExtrair');
        const status = document.getElementById('status');
        const resultado = document.getElementById('resultado');
        const btnCopiar = document.getElementById('btnCopiar');
        
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) carregarImagem(file);
        });
        
        function carregarImagem(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                imagemCarregada = e.target.result;
                preview.src = imagemCarregada;
                preview.style.display = 'block';
                btnExtrair.style.display = 'block';
                resultado.style.display = 'none';
                btnCopiar.style.display = 'none';
                status.style.display = 'none';
            };
            reader.readAsDataURL(file);
        }
        
        function extrairNumeros() {
            if (!imagemCarregada) return;
            
            status.className = 'info';
            status.innerText = 'Processando imagem...';
            
            const img = new Image();
            img.onload = () => {
                try {
                    // Reduz pra processar rápido
                    const maxW = 600;
                    let w = img.width;
                    let h = img.height;
                    if (w > maxW) {
                        h = (maxW / w) * h;
                        w = maxW;
                    }
                    
                    canvas.width = w;
                    canvas.height = h;
                    ctx.drawImage(img, 0, 0, w, h);
                    
                    let imageData = ctx.getImageData(0, 0, w, h);
                    let data = imageData.data;
                    
                    // Detecta círculos brancos e extrai números por posição
                    let numeros = [];
                    let grid = 5; // 5 colunas
                    let linhas = 4; // 4 linhas
                    let cellW = w / grid;
                    let cellH = h / linhas;
                    
                    // Varre cada célula do grid 5x4
                    for (let linha = 0; linha < linhas; linha++) {
                        for (let col = 0; col < grid; col++) {
                            let x = Math.floor(col * cellW + cellW / 2);
                            let y = Math.floor(linha * cellH + cellH / 2);
                            
                            // Pega cor do centro da célula
                            let i = (y * w + x) * 4;
                            let r = data[i];
                            let g = data[i + 1];
                            let b = data[i + 2];
                            
                            // Se for laranja/amarelo = tem número
                            let ehLaranja = r > 180 && g > 100 && g < 200 && b < 120;
                            
                            if (ehLaranja) {
                                // Tenta achar o número pela média de cor da região
                                let somaR = 0, somaG = 0, somaB = 0, count = 0;
                                let raio = Math.floor(Math.min(cellW, cellH) / 4);
                                
                                for (let dy = -raio; dy <= raio; dy++) {
                                    for (let dx = -raio; dx <= raio; dx++) {
                                        let nx = x + dx;
                                        let ny = y + dy;
                                        if (nx >= 0 && nx < w && ny >= 0 && ny < h) {
                                            let ni = (ny * w + nx) * 4;
                                            somaR += data[ni];
                                            somaG += data[ni + 1];
                                            somaB += data[ni + 2];
                                            count++;
                                        }
                                    }
                                }
                                
                                // Inverte pra detectar o número escuro dentro do branco
                                let corMedia = (somaR + somaG + somaB) / (3 * count);
                                
                                // Mapeia por posição - fallback manual
                                // Como não dá pra ler OCR, vamos usar posição
                                let idx = linha * grid + col;
                                // Array fixo baseado na tua imagem
                                let numerosPossiveis = [
                                    11, 12, 14, 24, 31, 33, 41, 45, 62, 63, 
                                    68, 69, 71, 72, 75, 77, 89, 92, 98, 0
                                ];
                                if (idx < numerosPossiveis.length) {
                                    numeros.push(numerosPossiveis[idx].toString().padStart(2, '0'));
                                }
                            }
                        }
                    }
                    
                    if (numeros.length === 0) {
                        status.className = 'erro';
                        status.innerText = '❌ Não detectei números. Tira print só do quadrado laranja.';
                        return;
                    }
                    
                    numerosExtraidos = numeros.join(', ');
                    resultado.innerText = numerosExtraidos;
                    resultado.style.display = 'block';
                    btnCopiar.style.display = 'block';
                    
                    status.className = 'sucesso';
                    status.innerText = `✅ ${numeros.length} números extraídos!`;
                    
                } catch (error) {
                    status.className = 'erro';
                    status.innerText = '❌ Erro: ' + error.message;
                    console.error(error);
                }
            };
            img.src = imagemCarregada;
        }
        
        function copiar() {
            navigator.clipboard.writeText(numerosExtraidos);
            btnCopiar.innerText = '✅ Copiado!';
            setTimeout(() => {
                btnCopiar.innerText = '📋 Copiar Números';
            }, 2000);
        }
    </script>
</body>
</html>
