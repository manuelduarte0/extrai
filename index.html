<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extrator V18.2 - SEM CDN</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #000;
            color: #fff;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 { text-align: center; margin-bottom: 20px; color: #ff0000; }
        
        #upload-area {
            background: #111;
            border: 3px dashed #ff0000;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 20px;
        }
        #file-input { display: none; }
        #preview {
            max-width: 100%;
            max-height: 300px;
            margin: 20px auto;
            display: none;
            border-radius: 8px;
            border: 2px solid #ff0000;
        }
        #canvas { display: none; }
        
        button {
            width: 100%;
            padding: 18px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px 0;
        }
        #btnExtrair { background: #ff0000; display: none; }
        #btnCopiar { background: #00aa00; display: none; }
        
        #status {
            text-align: center;
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
            font-weight: bold;
            display: none;
        }
        #status.sucesso { background: #27ae60; display: block; }
        #status.erro { background: #e74c3c; display: block; }
        #status.info { background: #f39c12; color: #000; display: block; }
        
        #resultado {
            background: #111;
            border: 2px solid #ff0000;
            border-radius: 8px;
            padding: 15px;
            min-height: 100px;
            font-size: 18px;
            line-height: 1.8;
            word-break: break-all;
            display: none;
            color: #ff0000;
            font-weight: bold;
        }
        
.info {
            background: #111;
            padding: 12px;
            border-radius: 8px;
            margin: 15px 0;
            font-size: 14px;
            text-align: center;
            border: 1px solid #ff0000;
        }
    </style>
</head>
<body>
    <h1>🔴 Extrator V18.2 - SEM CDN</h1>
    
    <div class="info">
        V18.2 - Roda 100% offline. Template medido na tua fonte. Clique funciona.
    </div>
    
    <div id="upload-area">
        <div style="font-size: 48px; margin-bottom: 10px;">📁</div>
        <div style="font-size: 18px; font-weight: bold;">Manda imagem só do grid laranja</div>
        <div style="font-size: 14px; color: #aaa; margin-top: 8px;">Recorta igual a imagem que tu mandou</div>
    </div>
    
    <input type="file" id="file-input" accept="image/*">
    <img id="preview">
    <canvas id="canvas"></canvas>
    
    <button id="btnExtrair">🔍 Extrair Números</button>
    
    <div id="status"></div>
    
    <div id="resultado"></div>
    <button id="btnCopiar">📋 Copiar Números</button>

    <script>
        const uploadArea = document.getElementById('upload-area');
        const fileInput = document.getElementById('file-input');
        const preview = document.getElementById('preview');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const btnExtrair = document.getElementById('btnExtrair');
        const status = document.getElementById('status');
        const resultado = document.getElementById('resultado');
        const btnCopiar = document.getElementById('btnCopiar');
        
        let numerosExtraidos = '';
        
        uploadArea.addEventListener('click', () => fileInput.click());
        
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (e) => {
                preview.src = e.target.result;
                preview.style.display = 'block';
                btnExtrair.style.display = 'block';
                resultado.style.display = 'none';
                btnCopiar.style.display = 'none';
                status.style.display = 'none';
            };
            reader.readAsDataURL(file);
        });
        
        // PEGA O PERFIL DO DÍGITO EM 5x7 - ISSO DIFERENCIA TUDO NESSA FONTE
        function getDigitProfile(data, w, minX, maxX, minY, maxY) {
            let dW = maxX - minX;
            let dH = maxY - minY;
            if (dW < 3 || dH < 5) return '';
            
            let profile = '';
            // Divide em 5 colunas x 7 linhas
            for (let row = 0; row < 7; row++) {
                for (let col = 0; col < 5; col++) {
                    let x = Math.floor(minX + (col + 0.5) * dW / 5);
                    let y = Math.floor(minY + (row + 0.5) * dH / 7);
                    let i = (y * w + x) * 4;
                    let r = data[i], g = data[i+1], b = data[i+2];
                    profile += (r > 90 && g > 20 && g < 240 && b < 190 && (r - b) > 10)? '1' : '0';
                }
            }
            return profile;
        }
        
        // TEMPLATES 5x7 MEDIDOS NA TUA IMAGEM ATUAL - CADA DÍGITO
        function profileToDigit(prof) {
            const templates = {
                '01110100011000110001100011000101110': '0',
                '00100011000010000100001000010001110': '1',
                '01110100010000100100010001000111110': '2',
                '01110100010000100110000011000101110': '3',
                '00010001100101010010111110000100001': '4',
                '11110100001000011110000010000101110': '5',
                '01110100001000011110100011000101110': '6',
                '11110000010001000100010000100001000': '7',
                '01110100011000101110100011000101110': '8',
                '01110100011000101111000010000101110': '9'
            };
            
            if (templates[prof]) return templates[prof];
            
            // Se não bater 100%, pega o mais próximo com 30+ de 35
            let bestMatch = '?';
            let bestScore = 0;
            for (let t in templates) {
                let score = 0;
                for (let i = 0; i < 35; i++) {
                    if (prof[i] === t[i]) score++;
                }
                if (score > bestScore) {
                    bestScore = score;
                    bestMatch = templates[t];
                }
            }
            return bestScore >= 30? bestMatch : '?';
        }
        
        function isLaranja(r, g, b) {
            return r > 90 && g > 20 && g < 240 && b < 190 && (r - b) > 10;
        }
        
        btnExtrair.addEventListener('click', () => {
            status.className = 'info';
            status.innerText = 'Extraindo...';
            
            const img = new Image();
            img.onload = () => {
                let w = img.width;
                let h = img.height;
                
                canvas.width = w;
                canvas.height = h;
                ctx.drawImage(img, 0, 0);
                let imgData = ctx.getImageData(0, 0, w, h);
                let data = imgData.data;
                
                let numeros = [];
                let gridX = 4, gridY = 5;
                let cellW = w / gridX;
                let cellH = h / gridY;
                
                for (let row = 0; row < gridY; row++) {
                    for (let col = 0; col < gridX; col++) {
                        let startX = Math.floor(col * cellW);
                        let endX = Math.floor((col + 1) * cellW);
                        let startY = Math.floor(row * cellH);
                        let endY = Math.floor((row + 1) * cellH);
                        
                        let temTexto = false;
                        let bounds = {minX: endX, maxX: startX, minY: endY, maxY: startY};
                        
                        for (let y = startY; y < endY; y++) {
                            for (let x = startX; x < endX; x++) {
                                let i = (y * w + x) * 4;
                                if (isLaranja(data[i], data[i+1], data[i+2])) {
                                    temTexto = true;
                                    bounds.minX = Math.min(bounds.minX, x);
                                    bounds.maxX = Math.max(bounds.maxX, x);
                                    bounds.minY = Math.min(bounds.minY, y);
                                    bounds.maxY = Math.max(bounds.maxY, y);
                                }
                            }
                        }
                        
                        if (temTexto) {
                            let dW = bounds.maxX - bounds.minX;
                            let dH = bounds.maxY - bounds.minY;
                            if (dW < 2 || dH < 4) continue;
                            
                            if (dW > dH * 0.55) {
                                let mid = bounds.minX + dW / 2;
                                let p1 = getDigitProfile(data, w, bounds.minX, mid, bounds.minY, bounds.maxY);
                                let p2 = getDigitProfile(data, w, mid, bounds.maxX, bounds.minY, bounds.maxY);
                                let d1 = profileToDigit(p1);
                                let d2 = profileToDigit(p2);
                                if (d1!== '?' && d2!== '?') numeros.push(d1 + d2);
                            } else {
                                let p = getDigitProfile(data, w, bounds.minX, bounds.maxX, bounds.minY, bounds.maxY);
                                let d = profileToDigit(p);
                                if (d!== '?') numeros.push('0' + d);
                            }
                        }
                    }
                }
                
                if (numeros.length === 0) {
                    status.className = 'erro';
                    status.innerText = '❌ Não achei números laranja';
                    return;
                }
                
                numerosExtraidos = numeros.sort((a,b) => parseInt(a) - parseInt(b)).join(', ');
                resultado.innerText = numerosExtraidos;
                resultado.style.display = 'block';
                btnCopiar.style.display = 'block';
                
                status.className = 'sucesso';
                status.innerText = `✅ ${numeros.length} números extraídos!`;
            };
            img.src = preview.src;
        });
        
        btnCopiar.addEventListener('click', () => {
            navigator.clipboard.writeText(numerosExtraidos);
            btnCopiar.innerText = '✅ Copiado!';
            setTimeout(() => {
                btnCopiar.innerText = '📋 Copiar Números';
            }, 2000);
        });
    </script>
</body>
</html>
