<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extrator V18.1 - FINAL</title>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #000;
            color: #fff;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 { text-align: center; margin-bottom: 20px; color: #ff0000; }
        
        #upload-area {
            background: #111;
            border: 3px dashed #ff0000;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 20px;
        }
        #file-input { display: none; }
        #preview {
            max-width: 100%;
            max-height: 300px;
            margin: 20px auto;
            display: none;
            border-radius: 8px;
            border: 2px solid #ff0000;
        }
        #canvas { display: none; }
        
        button {
            width: 100%;
            padding: 18px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px 0;
        }
        #btnExtrair { background: #ff0000; display: none; }
        #btnCopiar { background: #00aa00; display: none; }
        
        #status {
            text-align: center;
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
            font-weight: bold;
            display: none;
        }
        #status.sucesso { background: #27ae60; display: block; }
        #status.erro { background: #e74c3c; display: block; }
        #status.info { background: #f39c12; color: #000; display: block; }
        
        #resultado {
            background: #111;
            border: 2px solid #ff0000;
            border-radius: 8px;
            padding: 15px;
            min-height: 100px;
            font-size: 18px;
            line-height: 1.8;
            word-break: break-all;
            display: none;
            color: #ff0000;
            font-weight: bold;
        }
        
.info {
            background: #111;
            padding: 12px;
            border-radius: 8px;
            margin: 15px 0;
            font-size: 14px;
            text-align: center;
            border: 1px solid #ff0000;
        }
    </style>
</head>
<body>
    <h1>🔴 Extrator V18.1 - FINAL</h1>
    
    <div class="info">
        V18.1 - Converte laranja pra preto antes do OCR. Agora lê.
    </div>
    
    <div id="upload-area">
        <div style="font-size: 48px; margin-bottom: 10px;">📁</div>
        <div style="font-size: 18px; font-weight: bold;">Manda imagem só do grid laranja</div>
        <div style="font-size: 14px; color: #aaa; margin-top: 8px;">Recorta igual a imagem que tu mandou</div>
    </div>
    
    <input type="file" id="file-input" accept="image/*">
    <img id="preview">
    <canvas id="canvas"></canvas>
    
    <button id="btnExtrair">🔍 Extrair Números</button>
    
    <div id="status"></div>
    
    <div id="resultado"></div>
    <button id="btnCopiar">📋 Copiar Números</button>

    <script>
        const uploadArea = document.getElementById('upload-area');
        const fileInput = document.getElementById('file-input');
        const preview = document.getElementById('preview');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const btnExtrair = document.getElementById('btnExtrair');
        const status = document.getElementById('status');
        const resultado = document.getElementById('resultado');
        const btnCopiar = document.getElementById('btnCopiar');
        
        let numerosExtraidos = '';
        
        uploadArea.addEventListener('click', () => fileInput.click());
        
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (e) => {
                preview.src = e.target.result;
                preview.style.display = 'block';
                btnExtrair.style.display = 'block';
                resultado.style.display = 'none';
                btnCopiar.style.display = 'none';
                status.style.display = 'none';
            };
            reader.readAsDataURL(file);
        });
        
        // PRÉ-PROCESSA: LARANJA VIRA PRETO, RESTO VIRA BRANCO
        function preprocessImage(img) {
            canvas.width = img.width;
            canvas.height = img.height;
            ctx.drawImage(img, 0, 0);
            
            let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let data = imgData.data;
            
            for (let i = 0; i < data.length; i += 4) {
                let r = data[i], g = data[i+1], b = data[i+2];
                
                // Se for laranja = vira PRETO
                if (r > 90 && g > 20 && g < 240 && b < 190 && (r - b) > 10) {
                    data[i] = 0; data[i+1] = 0; data[i+2] = 0; // preto
                } else {
                    data[i] = 255; data[i+1] = 255; data[i+2] = 255; // branco
                }
            }
            ctx.putImageData(imgData, 0, 0);
            return canvas;
        }
        
        btnExtrair.addEventListener('click', async () => {
            status.className = 'info';
            status.innerText = 'Convertendo laranja pra preto...';
            
            const img = new Image();
            img.onload = async () => {
                try {
                    const canvasPreto = preprocessImage(img);
                    
                    status.innerText = 'Lendo com OCR... 0%';
                    
                    const { data: { text } } = await Tesseract.recognize(
                        canvasPreto,
                        'eng',
                        { 
                            logger: m => {
                                if (m.status === 'recognizing text') {
                                    status.innerText = `Lendo... ${Math.round(m.progress * 100)}%`;
                                }
                            },
                            tessedit_char_whitelist: '0123456789', // Só números
                        }
                    );
                    
                    // Pega só pares de dígitos
                    const matches = text.match(/\d{2}/g);
                    if (!matches || matches.length === 0) {
                        status.className = 'erro';
                        status.innerText = '❌ Não achei números. Tenta recortar melhor.';
                        return;
                    }
                    
                    numerosExtraidos = [...new Set(matches)].sort((a,b) => parseInt(a) - parseInt(b)).join(', ');
                    resultado.innerText = numerosExtraidos;
                    resultado.style.display = 'block';
                    btnCopiar.style.display = 'block';
                    
                    status.className = 'sucesso';
                    status.innerText = `✅ ${matches.length} números extraídos!`;
                    
                } catch (err) {
                    status.className = 'erro';
                    status.innerText = '❌ Erro: ' + err.message;
                }
            };
            img.src = preview.src;
        });
        
        btnCopiar.addEventListener('click', () => {
            navigator.clipboard.writeText(numerosExtraidos);
            btnCopiar.innerText = '✅ Copiado!';
            setTimeout(() => {
                btnCopiar.innerText = '📋 Copiar Números';
            }, 2000);
        });
    </script>
</body>
</html>
