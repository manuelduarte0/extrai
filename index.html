<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extrator Final</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #000;
            color: #fff;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 { text-align: center; margin-bottom: 20px; color: #ff0000; }
        
        #upload-area {
            background: #111;
            border: 3px dashed #ff0000;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 20px;
        }
        #file-input { display: none; }
        #preview {
            max-width: 100%;
            max-height: 300px;
            margin: 20px auto;
            display: none;
            border-radius: 8px;
            border: 2px solid #ff0000;
        }
        #canvasProcessada {
            max-width: 100%;
            margin: 20px auto;
            display: none;
            border-radius: 8px;
            border: 2px solid #00ff00;
        }
        #canvas { display: none; }
        
        button {
            width: 100%;
            padding: 18px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px 0;
        }
        #btnExtrair { background: #ff0000; display: none; }
        #btnCopiar { background: #00aa00; display: none; }
        
        #status {
            text-align: center;
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
            font-weight: bold;
            display: none;
        }
        #status.sucesso { background: #27ae60; display: block; }
        #status.erro { background: #e74c3c; display: block; }
        #status.info { background: #f39c12; color: #000; display: block; }
        
        #resultado {
            background: #111;
            border: 2px solid #ff0000;
            border-radius: 8px;
            padding: 15px;
            min-height: 100px;
            font-size: 18px;
            line-height: 1.8;
            word-break: break-all;
            display: none;
            color: #ff0000;
            font-weight: bold;
        }
        
.info {
            background: #111;
            padding: 12px;
            border-radius: 8px;
            margin: 15px 0;
            font-size: 14px;
            text-align: center;
            border: 1px solid #ff0000;
        }
    </style>
</head>
<body>
    <h1>🔴 Extrator Final V13.0</h1>
    
    <div class="info">
        V13.0 - Detecta SÓ o quadrado laranja maior. Ignora barra de cima. Grid sempre 4x5.
    </div>
    
    <div id="upload-area">
        <div style="font-size: 48px; margin-bottom: 10px;">📁</div>
        <div style="font-size: 18px; font-weight: bold;">Manda print da tela inteira</div>
        <div style="font-size: 14px; color: #aaa; margin-top: 8px;">Agora vai pegar o quadrado certo</div>
    </div>
    
    <input type="file" id="file-input" accept="image/*">
    <img id="preview">
    <canvas id="canvas"></canvas>
    <canvas id="canvasProcessada"></canvas>
    
    <button id="btnExtrair">🔍 Extrair Números</button>
    
    <div id="status"></div>
    
    <div id="resultado"></div>
    <button id="btnCopiar">📋 Copiar Números</button>

    <script>
        const uploadArea = document.getElementById('upload-area');
        const fileInput = document.getElementById('file-input');
        const preview = document.getElementById('preview');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const canvasProcessada = document.getElementById('canvasProcessada');
        const ctxProc = canvasProcessada.getContext('2d');
        const btnExtrair = document.getElementById('btnExtrair');
        const status = document.getElementById('status');
        const resultado = document.getElementById('resultado');
        const btnCopiar = document.getElementById('btnCopiar');
        
        let numerosExtraidos = '';
        
        uploadArea.addEventListener('click', () => fileInput.click());
        
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (e) => {
                preview.src = e.target.result;
                preview.style.display = 'block';
                btnExtrair.style.display = 'block';
                canvasProcessada.style.display = 'none';
                resultado.style.display = 'none';
                btnCopiar.style.display = 'none';
                status.style.display = 'none';
            };
            reader.readAsDataURL(file);
        });
        
        // Templates de dígitos mais robustos
        function matchDigit(pattern) {
            const templates = {
                '01110100011000101110': '0',
                '00100010001000100010': '1', 
                '111000010011100010111': '2',
                '111000010011100001111': '3',
                '1001010010111100100': '4',
                '111101000011100001111': '5',
                '01110100001111010111': '6',
                '11100010001000100010': '7',
                '01110101001110101110': '8',
                '01110101001110001110': '9'
            };
            
            // Calcula similaridade com cada template
            let bestMatch = '?';
            let bestScore = 0;
            for (let tmpl in templates) {
                if (tmpl.length!== pattern.length) continue;
                let score = 0;
                for (let i = 0; i < pattern.length; i++) {
                    if (pattern[i] === tmpl[i]) score++;
                }
                score = score / pattern.length;
                if (score > bestScore && score > 0.7) {
                    bestScore = score;
                    bestMatch = templates[tmpl];
                }
            }
            return bestMatch;
        }
        
        btnExtrair.addEventListener('click', () => {
            status.className = 'info';
            status.innerText = 'Detectando quadrado laranja...';
            
            const img = new Image();
            img.onload = () => {
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);
                let imgData = ctx.getImageData(0, 0, img.width, img.height);
                let data = imgData.data;
                
                // 1. Acha todos os retângulos laranja e pega o MAIOR
                let regions = [];
                let visited = new Uint8Array(img.width * img.height);
                
                for (let y = 0; y < img.height; y++) {
                    for (let x = 0; x < img.width; x++) {
                        let idx = y * img.width + x;
                        if (visited[idx]) continue;
                        
                        let i = idx * 4;
                        let r = data[i], g = data[i+1], b = data[i+2];
                        
                        // Laranja do fundo do jogo: R>180, G entre 90-160, B<100
                        if (r > 180 && g > 90 && g < 160 && b < 100) {
                            // Flood fill pra achar o retângulo
                            let stack = [[x, y]];
                            let minX = x, maxX = x, minY = y, maxY = y;
                            let count = 0;
                            
                            while (stack.length > 0) {
                                let [cx, cy] = stack.pop();
                                let cidx = cy * img.width + cx;
                                if (visited[cidx]) continue;
                                visited[cidx] = 1;
                                
                                let ci = cidx * 4;
                                let cr = data[ci], cg = data[ci+1], cb = data[ci+2];
                                if (cr > 180 && cg > 90 && cg < 160 && cb < 100) {
                                    count++;
                                    minX = Math.min(minX, cx);
                                    maxX = Math.max(maxX, cx);
                                    minY = Math.min(minY, cy);
                                    maxY = Math.max(maxY, cy);
                                    
                                    if (cx > 0) stack.push([cx-1, cy]);
                                    if (cx < img.width-1) stack.push([cx+1, cy]);
                                    if (cy > 0) stack.push([cx, cy-1]);
                                    if (cy < img.height-1) stack.push([cx, cy+1]);
                                }
                            }
                            
                            let w = maxX - minX;
                            let h = maxY - minY;
                            // Só considera se for grande e mais largo que alto
                            if (count > 10000 && w > h * 0.7) {
                                regions.push({x: minX, y: minY, w: w, h: h, area: w*h});
                            }
                        }
                    }
                }
                
                if (regions.length === 0) {
                    status.className = 'erro';
                    status.innerText = '❌ Não achei quadrado laranja';
                    return;
                }
                
                // Pega o maior retângulo
                regions.sort((a,b) => b.area - a.area);
                let rect = regions[0];
                
                status.className = 'info';
                status.innerText = 'Lendo números do grid 4x5...';
                
                // 2. Recorta e processa só o grid
                let cropData = ctx.getImageData(rect.x, rect.y, rect.w, rect.h);
                canvas.width = 400;
                canvas.height = 500;
                ctx.putImageData(cropData, 0, 0);
                ctx.drawImage(canvas, 0, 0, rect.w, rect.h, 0, 0, 400, 500);
                
                let imageData = ctx.getImageData(0, 0, 400, 500);
                data = imageData.data;
                
                canvasProcessada.width = 400;
                canvasProcessada.height = 500;
                let outputData = ctxProc.createImageData(400, 500);
                let out = outputData.data;
                
                let numeros = [];
                let gridX = 4, gridY = 5;
                let cellW = 400 / gridX, cellH = 500 / gridY;
                
                for (let row = 0; row < gridY; row++) {
                    for (let col = 0; col < gridX; col++) {
                        let startX = Math.floor(col * cellW + cellW*0.1);
                        let startY = Math.floor(row * cellH + cellH*0.1);
                        let endX = Math.floor((col + 1) * cellW - cellW*0.1);
                        let endY = Math.floor((row + 1) * cellH - cellH*0.1);
                        
                        let temNumero = false;
                        let digitBounds = {minX: endX, maxX: startX, minY: endY, maxY: startY};
                        
                        for (let y = startY; y < endY; y++) {
                            for (let x = startX; x < endX; x++) {
                                let i = (y * 400 + x) * 4;
                                let r = data[i], g = data[i+1], b = data[i+2];
                                
                                // Número laranja dentro do círculo
                                if (r > 150 && g > 70 && g < 190 && b < 130 && r-g > 20) {
                                    temNumero = true;
                                    out[i] = 255; out[i+1] = 0; out[i+2] = 0; out[i+3] = 255;
                                    digitBounds.minX = Math.min(digitBounds.minX, x);
                                    digitBounds.maxX = Math.max(digitBounds.maxX, x);
                                    digitBounds.minY = Math.min(digitBounds.minY, y);
                                    digitBounds.maxY = Math.max(digitBounds.maxY, y);
                                } else if (r > 180 && g > 180 && b > 180) {
                                    out[i] = 255; out[i+1] = 255; out[i+2] = 255; out[i+3] = 255;
                                } else {
                                    out[i] = 0; out[i+1] = 0; out[i+2] = 0; out[i+3] = 255;
                                }
                            }
                        }
                        
                        if (temNumero) {
                            let dW = digitBounds.maxX - digitBounds.minX;
                            let dH = digitBounds.maxY - digitBounds.minY;
                            
                            // Extrai matriz 5x5 do dígito
                            let pattern = '';
                            for (let r = 0; r < 5; r++) {
                                for (let c = 0; c < 5; c++) {
                                    let px = Math.floor(digitBounds.minX + c * dW / 5);
                                    let py = Math.floor(digitBounds.minY + r * dH / 5);
                                    let i = (py * 400 + px) * 4;
                                    pattern += (data[i] > 150 && data[i+1] < 150)? '1' : '0';
                                }
                            }
                            
                            // Dois dígitos se for largo
                            if (dW > dH * 0.65) {
                                let p1 = '', p2 = '';
                                for (let r = 0; r < 5; r++) {
                                    for (let c = 0; c < 5; c++) {
                                        let px1 = Math.floor(digitBounds.minX + c * dW / 10);
                                        let px2 = Math.floor(digitBounds.minX + dW/2 + c * dW / 10);
                                        let py = Math.floor(digitBounds.minY + r * dH / 5);
                                        let i1 = (py * 400 + px1) * 4;
                                        let i2 = (py * 400 + px2) * 4;
                                        p1 += (data[i1] > 150 && data[i1+1] < 150)? '1' : '0';
                                        p2 += (data[i2] > 150 && data[i2+1] < 150)? '1' : '0';
                                    }
                                }
                                let d1 = matchDigit(p1);
                                let d2 = matchDigit(p2);
                                if (d1!== '?' && d2!== '?') numeros.push(d1 + d2);
                            } else {
                                let d = matchDigit(pattern);
                                if (d!== '?') numeros.push('0' + d);
                            }
                        }
                    }
                }
                
                ctxProc.putImageData(outputData, 0, 0);
                canvasProcessada.style.display = 'block';
                
                if (numeros.length === 0) {
                    status.className = 'erro';
                    status.innerText = '❌ Não consegui ler os números';
                    return;
                }
                
                numerosExtraidos = numeros.sort((a,b) => parseInt(a) - parseInt(b)).join(', ');
                resultado.innerText = numerosExtraidos;
                resultado.style.display = 'block';
                btnCopiar.style.display = 'block';
                
                status.className = 'sucesso';
                status.innerText = `✅ ${numeros.length} números extraídos!`;
            };
            img.src = preview.src;
        });
        
        btnCopiar.addEventListener('click', () => {
            navigator.clipboard.writeText(numerosExtraidos);
            btnCopiar.innerText = '✅ Copiado!';
            setTimeout(() => {
                btnCopiar.innerText = '📋 Copiar Números';
            }, 2000);
        });
    </script>
</body>
</html>
