<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extrator Real</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #000;
            color: #fff;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 { text-align: center; margin-bottom: 20px; color: #ff0000; }
        
        #upload-area {
            background: #111;
            border: 3px dashed #ff0000;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 20px;
        }
        #file-input { display: none; }
        #preview {
            max-width: 100%;
            max-height: 300px;
            margin: 20px auto;
            display: none;
            border-radius: 8px;
            border: 2px solid #ff0000;
        }
        #canvasProcessada {
            max-width: 100%;
            margin: 20px auto;
            display: none;
            border-radius: 8px;
            border: 2px solid #00ff00;
        }
        #canvas { display: none; }
        
        button {
            width: 100%;
            padding: 18px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px 0;
        }
        #btnExtrair { background: #ff0000; display: none; }
        #btnCopiar { background: #00aa00; display: none; }
        
        #status {
            text-align: center;
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
            font-weight: bold;
            display: none;
        }
        #status.sucesso { background: #27ae60; display: block; }
        #status.erro { background: #e74c3c; display: block; }
        #status.info { background: #f39c12; color: #000; display: block; }
        
        #resultado {
            background: #111;
            border: 2px solid #ff0000;
            border-radius: 8px;
            padding: 15px;
            min-height: 100px;
            font-size: 18px;
            line-height: 1.8;
            word-break: break-all;
            display: none;
            color: #ff0000;
            font-weight: bold;
        }
        
.info {
            background: #111;
            padding: 12px;
            border-radius: 8px;
            margin: 15px 0;
            font-size: 14px;
            text-align: center;
            border: 1px solid #ff0000;
        }
    </style>
</head>
<body>
    <h1>🔴 Extrator Real V11.0</h1>
    
    <div class="info">
        V11.0 - Lê o número dentro de cada círculo. Sem mapa fixo. Funciona com qualquer jogo.
    </div>
    
    <div id="upload-area">
        <div style="font-size: 48px; margin-bottom: 10px;">📁</div>
        <div style="font-size: 18px; font-weight: bold;">Envia o print do quadrado laranja</div>
        <div style="font-size: 14px; color: #aaa; margin-top: 8px;">Corta bem justo, sem borda azul</div>
    </div>
    
    <input type="file" id="file-input" accept="image/*">
    <img id="preview">
    <canvas id="canvas"></canvas>
    <canvas id="canvasProcessada"></canvas>
    
    <button id="btnExtrair">🔍 Processar + Extrair Números</button>
    
    <div id="status"></div>
    
    <div id="resultado"></div>
    <button id="btnCopiar">📋 Copiar Números</button>

    <script>
        const uploadArea = document.getElementById('upload-area');
        const fileInput = document.getElementById('file-input');
        const preview = document.getElementById('preview');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const canvasProcessada = document.getElementById('canvasProcessada');
        const ctxProc = canvasProcessada.getContext('2d');
        const btnExtrair = document.getElementById('btnExtrair');
        const status = document.getElementById('status');
        const resultado = document.getElementById('resultado');
        const btnCopiar = document.getElementById('btnCopiar');
        
        let numerosExtraidos = '';
        
        uploadArea.addEventListener('click', () => fileInput.click());
        
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (e) => {
                preview.src = e.target.result;
                preview.style.display = 'block';
                btnExtrair.style.display = 'block';
                canvasProcessada.style.display = 'none';
                resultado.style.display = 'none';
                btnCopiar.style.display = 'none';
                status.style.display = 'none';
            };
            reader.readAsDataURL(file);
        });
        
        // Padrões de dígitos 0-9 em matriz 5x3
        const DIGITOS = {
            '111101101111': '0',
            '010010010010': '1',
            '111001111100111': '2',
            '111001111001111': '3',
            '101101111001001': '4',
            '111100111001111': '5',
            '111100111101111': '6',
            '111001001001001': '7',
            '111101111101111': '8',
            '111101111001111': '9'
        };
        
        function reconhecerDigito(imgData, x, y, w, h) {
            // Reduz pra 5x3 e binariza
            let matriz = '';
            let stepY = h / 5;
            let stepX = w / 3;
            
            for (let row = 0; row < 5; row++) {
                for (let col = 0; col < 3; col++) {
                    let soma = 0;
                    let count = 0;
                    for (let dy = 0; dy < stepY; dy++) {
                        for (let dx = 0; dx < stepX; dx++) {
                            let px = Math.floor(x + col * stepX + dx);
                            let py = Math.floor(y + row * stepY + dy);
                            if (px >= 0 && px < imgData.width && py >= 0 && py < imgData.height) {
                                let i = (py * imgData.width + px) * 4;
                                let r = imgData.data[i];
                                let g = imgData.data[i + 1];
                                let b = imgData.data[i + 2];
                                // Se for laranja/vermelho
                                if (r > 150 && g < 150 && b < 150) soma++;
                                count++;
                            }
                        }
                    }
                    matriz += (soma / count > 0.3)? '1' : '0';
                }
            }
            return DIGITOS[matriz] || '?';
        }
        
        btnExtrair.addEventListener('click', () => {
            status.className = 'info';
            status.innerText = 'Processando e lendo números...';
            
            const img = new Image();
            img.onload = () => {
                let w = 400;
                let h = 500;
                
                canvas.width = w;
                canvas.height = h;
                ctx.drawImage(img, 0, 0, w, h);
                
                canvasProcessada.width = w;
                canvasProcessada.height = h;
                
                let imageData = ctx.getImageData(0, 0, w, h);
                let data = imageData.data;
                let outputData = ctxProc.createImageData(w, h);
                let out = outputData.data;
                
                let numeros = [];
                let gridX = 4;
                let gridY = 5;
                let cellW = w / gridX;
                let cellH = h / gridY;
                
                for (let row = 0; row < gridY; row++) {
                    for (let col = 0; col < gridX; col++) {
                        let startX = Math.floor(col * cellW);
                        let startY = Math.floor(row * cellH);
                        let endX = Math.floor((col + 1) * cellW);
                        let endY = Math.floor((row + 1) * cellH);
                        
                        let temLaranja = false;
                        let minX = endX, maxX = startX, minY = endY, maxY = startY;
                        
                        // 1. Pinta de preto/branco/vermelho e acha bounds do número
                        for (let y = startY; y < endY; y++) {
                            for (let x = startX; x < endX; x++) {
                                let i = (y * w + x) * 4;
                                let r = data[i];
                                let g = data[i + 1];
                                let b = data[i + 2];
                                
                                // Laranja do número
                                if (r > 160 && g > 70 && g < 200 && b < 130) {
                                    temLaranja = true;
                                    out[i] = 255; out[i+1] = 0; out[i+2] = 0; out[i+3] = 255;
                                    minX = Math.min(minX, x);
                                    maxX = Math.max(maxX, x);
                                    minY = Math.min(minY, y);
                                    maxY = Math.max(maxY, y);
                                } 
                                // Branco
                                else if (r > 180 && g > 180 && b > 180) {
                                    out[i] = 255; out[i+1] = 255; out[i+2] = 255; out[i+3] = 255;
                                } 
                                // Fundo
                                else {
                                    out[i] = 0; out[i+1] = 0; out[i+2] = 0; out[i+3] = 255;
                                }
                            }
                        }
                        
                        // 2. Se achou laranja, lê os dígitos
                        if (temLaranja) {
                            let numW = maxX - minX;
                            let numH = maxY - minY;
                            
                            // Se for 2 dígitos: divide no meio
                            if (numW > numH * 0.6) {
                                let d1 = reconhecerDigito(imageData, minX, minY, numW/2, numH);
                                let d2 = reconhecerDigito(imageData, minX + numW/2, minY, numW/2, numH);
                                if (d1!== '?' && d2!== '?') {
                                    numeros.push(d1 + d2);
                                }
                            } else {
                                let d = reconhecerDigito(imageData, minX, minY, numW, numH);
                                if (d!== '?') {
                                    numeros.push('0' + d);
                                }
                            }
                        }
                    }
                }
                
                ctxProc.putImageData(outputData, 0, 0);
                canvasProcessada.style.display = 'block';
                
                if (numeros.length === 0) {
                    status.className = 'erro';
                    status.innerText = '❌ Não consegui ler os números. Corta melhor a imagem.';
                    return;
                }
                
                numerosExtraidos = numeros.sort((a,b) => parseInt(a) - parseInt(b)).join(', ');
                resultado.innerText = numerosExtraidos;
                resultado.style.display = 'block';
                btnCopiar.style.display = 'block';
                
                status.className = 'sucesso';
                status.innerText = `✅ ${numeros.length} números lidos!`;
            };
            img.src = preview.src;
        });
        
        btnCopiar.addEventListener('click', () => {
            navigator.clipboard.writeText(numerosExtraidos);
            btnCopiar.innerText = '✅ Copiado!';
            setTimeout(() => {
                btnCopiar.innerText = '📋 Copiar Números';
            }, 2000);
        });
    </script>
</body>
</html>
