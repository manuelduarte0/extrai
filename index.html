<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extrator Definitivo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #000;
            color: #fff;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 { text-align: center; margin-bottom: 20px; color: #ff0000; }
        
        #upload-area {
            background: #111;
            border: 3px dashed #ff0000;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 20px;
        }
        #file-input { display: none; }
        #preview {
            max-width: 100%;
            max-height: 300px;
            margin: 20px auto;
            display: none;
            border-radius: 8px;
            border: 2px solid #ff0000;
        }
        #canvasProcessada {
            max-width: 100%;
            margin: 20px auto;
            display: none;
            border-radius: 8px;
            border: 2px solid #00ff00;
        }
        #canvas { display: none; }
        
        button {
            width: 100%;
            padding: 18px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px 0;
        }
        #btnExtrair { background: #ff0000; display: none; }
        #btnCopiar { background: #00aa00; display: none; }
        
        #status {
            text-align: center;
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
            font-weight: bold;
            display: none;
        }
        #status.sucesso { background: #27ae60; display: block; }
        #status.erro { background: #e74c3c; display: block; }
        #status.info { background: #f39c12; color: #000; display: block; }
        
        #resultado {
            background: #111;
            border: 2px solid #ff0000;
            border-radius: 8px;
            padding: 15px;
            min-height: 100px;
            font-size: 18px;
            line-height: 1.8;
            word-break: break-all;
            display: none;
            color: #ff0000;
            font-weight: bold;
        }
        
       .info {
            background: #111;
            padding: 12px;
            border-radius: 8px;
            margin: 15px 0;
            font-size: 14px;
            text-align: center;
            border: 1px solid #ff0000;
        }
    </style>
</head>
<body>
    <h1>🔴 Extrator Definitivo V14.1</h1>
    
    <div class="info">
        V14.1 Final - Detecta 20 círculos brancos. Lê número laranja dentro. 100% offline.
    </div>
    
    <div id="upload-area">
        <div style="font-size: 48px; margin-bottom: 10px;">📁</div>
        <div style="font-size: 18px; font-weight: bold;">Manda print da tela inteira</div>
        <div style="font-size: 14px; color: #aaa; margin-top: 8px;">Funciona com qualquer cartela 4x5</div>
    </div>
    
    <input type="file" id="file-input" accept="image/*">
    <img id="preview">
    <canvas id="canvas"></canvas>
    <canvas id="canvasProcessada"></canvas>
    
    <button id="btnExtrair">🔍 Extrair Números</button>
    
    <div id="status"></div>
    
    <div id="resultado"></div>
    <button id="btnCopiar">📋 Copiar Números</button>

    <script>
        const uploadArea = document.getElementById('upload-area');
        const fileInput = document.getElementById('file-input');
        const preview = document.getElementById('preview');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const canvasProcessada = document.getElementById('canvasProcessada');
        const ctxProc = canvasProcessada.getContext('2d');
        const btnExtrair = document.getElementById('btnExtrair');
        const status = document.getElementById('status');
        const resultado = document.getElementById('resultado');
        const btnCopiar = document.getElementById('btnCopiar');
        
        let numerosExtraidos = '';
        
        uploadArea.addEventListener('click', () => fileInput.click());
        
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (e) => {
                preview.src = e.target.result;
                preview.style.display = 'block';
                btnExtrair.style.display = 'block';
                canvasProcessada.style.display = 'none';
                resultado.style.display = 'none';
                btnCopiar.style.display = 'none';
                status.style.display = 'none';
            };
            reader.readAsDataURL(file);
        });
        
        function matchDigit(pattern) {
            const templates = {
                '01110100011000101110': '0',
                '00100010001000100010': '1', 
                '111000010011100010111': '2',
                '111000010011100001111': '3',
                '10010100101111001000100': '4',
                '111101000011100001111': '5',
                '01110100001111010111': '6',
                '11100010001000100010': '7',
                '01110101001110101110': '8',
                '01110101001110001110': '9',
                '0111010001100010111': '0',
                '0010001000100010001': '1'
            };
            
            let bestMatch = '?';
            let bestScore = 0;
            for (let tmpl in templates) {
                let len = Math.min(tmpl.length, pattern.length);
                if (len < 15) continue;
                let score = 0;
                for (let i = 0; i < len; i++) {
                    if (pattern[i] === tmpl[i]) score++;
                }
                score = score / len;
                if (score > bestScore && score >= 0.65) {
                    bestScore = score;
                    bestMatch = templates[tmpl];
                }
            }
            return bestMatch;
        }
        
        function isLaranja(r, g, b) {
            // Laranja do número: R alto, G médio, B baixo
            return r > 130 && g > 50 && g < 200 && b < 150 && (r - g) > 10 && (r - b) > 40;
        }
        
        btnExtrair.addEventListener('click', () => {
            status.className = 'info';
            status.innerText = 'Detectando círculos brancos...';
            
            const img = new Image();
            img.onload = () => {
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);
                let imgData = ctx.getImageData(0, 0, img.width, img.height);
                let data = imgData.data;
                
                // 1. Acha círculos brancos - varre de 8 em 8px
                let circles = [];
                let step = 8;
                
                for (let y = step; y < img.height - step; y += step) {
                    for (let x = step; x < img.width - step; x += step) {
                        let i = (y * img.width + x) * 4;
                        let r = data[i], g = data[i+1], b = data[i+2];
                        
                        if (r > 200 && g > 200 && b > 200) {
                            // Checa se tem área branca grande em volta
                            let whitePixels = 0;
                            let checkRadius = 15;
                            for (let dy = -checkRadius; dy <= checkRadius; dy += 5) {
                                for (let dx = -checkRadius; dx <= checkRadius; dx += 5) {
                                    let nx = x + dx, ny = y + dy;
                                    if (nx < 0 || ny < 0 || nx >= img.width || ny >= img.height) continue;
                                    let ni = (ny * img.width + nx) * 4;
                                    if (data[ni] > 200 && data[ni+1] > 200 && data[ni+2] > 200) whitePixels++;
                                }
                            }
                            
                            if (whitePixels > 15) {
                                // Evita duplicata
                                let tooClose = false;
                                for (let c of circles) {
                                    let dist = Math.sqrt((c.x-x)**2 + (c.y-y)**2);
                                    if (dist < 40) { tooClose = true; break; }
                                }
                                if (!tooClose) circles.push({x: x, y: y});
                            }
                        }
                    }
                }
                
                if (circles.length < 18) {
                    status.className = 'erro';
                    status.innerText = `❌ Achei só ${circles.length} círculos. Precisa de 20. Print mais nítido ou com menos zoom.`;
                    return;
                }
                
                // 2. Ordena em grid 4x5 - pega só os 20 mais centrais
                circles.sort((a,b) => a.y - b.y);
                circles = circles.slice(0, 20);
                
                // Agrupa por linha baseado em Y
                circles.sort((a,b) => a.y - b.y);
                let rows = [[], [], [], [], []];
                let currentRow = 0;
                let lastY = circles[0].y;
                
                for (let c of circles) {
                    if (Math.abs(c.y - lastY) > 30 && currentRow < 4) {
                        currentRow++;
                        lastY = c.y;
                    }
                    rows[currentRow].push(c);
                }
                
                // Ordena cada linha por X
                for (let i = 0; i < 5; i++) {
                    rows[i].sort((a,b) => a.x - b.x);
                    rows[i] = rows[i].slice(0, 4); // Garante 4 por linha
                }
                
                status.className = 'info';
                status.innerText = `Lendo 20 números...`;
                
                // 3. Lê cada círculo
                canvasProcessada.width = img.width;
                canvasProcessada.height = img.height;
                let outputData = ctxProc.createImageData(img.width, img.height);
                let out = outputData.data;
                
                let numeros = [];
                let raioAnalise = 22;
                
                for (let row = 0; row < 5; row++) {
                    for (let col = 0; col < 4; col++) {
                        if (!rows[row][col]) continue;
                        let circle = rows[row][col];
                        
                        let digitBounds = {minX: circle.x+raioAnalise, maxX: circle.x-raioAnalise, minY: circle.y+raioAnalise, maxY: circle.y-raioAnalise};
                        let temLaranja = false;
                        
                        for (let y = circle.y - raioAnalise; y < circle.y + raioAnalise; y++) {
                            for (let x = circle.x - raioAnalise; x < circle.x + raioAnalise; x++) {
                                if (x < 0 || y < 0 || x >= img.width || y >= img.height) continue;
                                
                                let i = (y * img.width + x) * 4;
                                let r = data[i], g = data[i+1], b = data[i+2];
                                
                                let dist = Math.sqrt((x-circle.x)**2 + (y-circle.y)**2);
                                if (dist > raioAnalise) continue;
                                
                                if (isLaranja(r, g, b)) {
                                    temLaranja = true;
                                    out[i] = 255; out[i+1] = 0; out[i+2] = 0; out[i+3] = 255;
                                    digitBounds.minX = Math.min(digitBounds.minX, x);
                                    digitBounds.maxX = Math.max(digitBounds.maxX, x);
                                    digitBounds.minY = Math.min(digitBounds.minY, y);
                                    digitBounds.maxY = Math.max(digitBounds.maxY, y);
                                } else if (r > 180 && g > 180 && b > 180) {
                                    out[i] = 255; out[i+1] = 255; out[i+2] = 255; out[i+3] = 255;
                                } else {
                                    out[i] = 0; out[i+1] = 0; out[i+2] = 0; out[i+3] = 255;
                                }
                            }
                        }
                        
                        if (temLaranja) {
                            let dW = digitBounds.maxX - digitBounds.minX;
                            let dH = digitBounds.maxY - digitBounds.minY;
                            if (dW < 3 || dH < 5) continue;
                            
                            // Dois dígitos se largura > 65% altura
                            if (dW > dH * 0.65) {
                                let p1 = '', p2 = '';
                                for (let r = 0; r < 5; r++) {
                                    for (let c = 0; c < 5; c++) {
                                        let px1 = Math.floor(digitBounds.minX + c * dW / 10);
                                        let px2 = Math.floor(digitBounds.minX + dW/2 + c * dW / 10);
                                        let py = Math.floor(digitBounds.minY + r * dH / 5);
                                        let i1 = (py * img.width + px1) * 4;
                                        let i2 = (py * img.width + px2) * 4;
                                        p1 += isLaranja(data[i1], data[i1+1], data[i1+2])? '1' : '0';
                                        p2 += isLaranja(data[i2], data[i2+1], data[i2+2])? '1' : '0';
                                    }
                                }
                                let d1 = matchDigit(p1);
                                let d2 = matchDigit(p2);
                                if (d1!== '?' && d2!== '?') numeros.push(d1 + d2);
                            } else {
                                let pattern = '';
                                for (let r = 0; r < 5; r++) {
                                    for (let c = 0; c < 5; c++) {
                                        let px = Math.floor(digitBounds.minX + c * dW / 5);
                                        let py = Math.floor(digitBounds.minY + r * dH / 5);
                                        let i = (py * img.width + px) * 4;
                                        pattern += isLaranja(data[i], data[i+1], data[i+2])? '1' : '0';
                                    }
                                }
                                let d = matchDigit(pattern);
                                if (d!== '?') numeros.push('0' + d);
                            }
                        }
                    }
                }
                
                ctxProc.putImageData(outputData, 0, 0);
                canvasProcessada.style.display = 'block';
                
                if (numeros.length === 0) {
                    status.className = 'erro';
                    status.innerText = '❌ Não achei números laranja nos círculos';
                    return;
                }
                
                numerosExtraidos = numeros.sort((a,b) => parseInt(a) - parseInt(b)).join(', ');
                resultado.innerText = numerosExtraidos;
                resultado.style.display = 'block';
                btnCopiar.style.display = 'block';
                
                status.className = 'sucesso';
                status.innerText = `✅ ${numeros.length} números extraídos!`;
            };
            img.src = preview.src;
        });
        
        btnCopiar.addEventListener('click', () => {
            navigator.clipboard.writeText(numerosExtraidos);
            btnCopiar.innerText = '✅ Copiado!';
            setTimeout(() => {
                btnCopiar.innerText = '📋 Copiar Números';
            }, 2000);
        });
    </script>
</body>
</html>
