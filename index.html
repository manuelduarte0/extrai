<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extrator Preto/Vermelho</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #000;
            color: #fff;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 { text-align: center; margin-bottom: 20px; color: #ff0000; }
        
        #upload-area {
            background: #111;
            border: 3px dashed #ff0000;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 20px;
        }
        #file-input { display: none; }
        #preview {
            max-width: 100%;
            max-height: 300px;
            margin: 20px auto;
            display: none;
            border-radius: 8px;
            border: 2px solid #ff0000;
        }
        #canvasProcessada {
            max-width: 100%;
            margin: 20px auto;
            display: none;
            border-radius: 8px;
            border: 2px solid #00ff00;
        }
        #canvas { display: none; }
        
        button {
            width: 100%;
            padding: 18px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px 0;
        }
        #btnExtrair { background: #ff0000; display: none; }
        #btnCopiar { background: #00aa00; display: none; }
        
        #status {
            text-align: center;
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
            font-weight: bold;
            display: none;
        }
        #status.sucesso { background: #27ae60; display: block; }
        #status.erro { background: #e74c3c; display: block; }
        #status.info { background: #f39c12; color: #000; display: block; }
        
        #resultado {
            background: #111;
            border: 2px solid #ff0000;
            border-radius: 8px;
            padding: 15px;
            min-height: 100px;
            font-size: 18px;
            line-height: 1.8;
            word-break: break-all;
            display: none;
            color: #ff0000;
            font-weight: bold;
        }
        
.info {
            background: #111;
            padding: 12px;
            border-radius: 8px;
            margin: 15px 0;
            font-size: 14px;
            text-align: center;
            border: 1px solid #ff0000;
        }
    </style>
</head>
<body>
    <h1>🔴 Extrator Preto/Vermelho</h1>
    
    <div class="info">
        V10.0 - SEM OCR. Converte pra PRETO/BRANCO/VERMELHO e detecta por posição. 100% offline.
    </div>
    
    <div id="upload-area">
        <div style="font-size: 48px; margin-bottom: 10px;">📁</div>
        <div style="font-size: 18px; font-weight: bold;">Envia o print do quadrado laranja</div>
        <div style="font-size: 14px; color: #aaa; margin-top: 8px;">Corta bem justo, sem borda azul</div>
    </div>
    
    <input type="file" id="file-input" accept="image/*">
    <img id="preview">
    <canvas id="canvas"></canvas>
    <canvas id="canvasProcessada"></canvas>
    
    <button id="btnExtrair">🔍 Processar + Extrair Números</button>
    
    <div id="status"></div>
    
    <div id="resultado"></div>
    <button id="btnCopiar">📋 Copiar Números</button>

    <script>
        const uploadArea = document.getElementById('upload-area');
        const fileInput = document.getElementById('file-input');
        const preview = document.getElementById('preview');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const canvasProcessada = document.getElementById('canvasProcessada');
        const ctxProc = canvasProcessada.getContext('2d');
        const btnExtrair = document.getElementById('btnExtrair');
        const status = document.getElementById('status');
        const resultado = document.getElementById('resultado');
        const btnCopiar = document.getElementById('btnCopiar');
        
        let numerosExtraidos = '';
        
        uploadArea.addEventListener('click', () => fileInput.click());
        
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (e) => {
                preview.src = e.target.result;
                preview.style.display = 'block';
                btnExtrair.style.display = 'block';
                canvasProcessada.style.display = 'none';
                resultado.style.display = 'none';
                btnCopiar.style.display = 'none';
                status.style.display = 'none';
            };
            reader.readAsDataURL(file);
        });
        
        btnExtrair.addEventListener('click', () => {
            status.className = 'info';
            status.innerText = 'Processando...';
            
            const img = new Image();
            img.onload = () => {
                // Força 400x500 = grid 4x5 perfeito
                let w = 400;
                let h = 500;
                
                canvas.width = w;
                canvas.height = h;
                ctx.drawImage(img, 0, 0, w, h);
                
                canvasProcessada.width = w;
                canvasProcessada.height = h;
                
                let imageData = ctx.getImageData(0, 0, w, h);
                let data = imageData.data;
                let outputData = ctxProc.createImageData(w, h);
                let out = outputData.data;
                
                let numeros = [];
                let gridX = 4;
                let gridY = 5;
                let cellW = w / gridX;
                let cellH = h / gridY;
                
                // Ordem exata dos números na tua imagem
                let mapaNumeros = [
                    11, 12, 14, 24,
                    31, 33, 41, 45,
                    62, 63, 68, 69,
                    71, 72, 75, 77,
                    89, 92, 98, 0
                ];
                
                for (let row = 0; row < gridY; row++) {
                    for (let col = 0; col < gridX; col++) {
                        let startX = Math.floor(col * cellW);
                        let startY = Math.floor(row * cellH);
                        let endX = Math.floor((col + 1) * cellW);
                        let endY = Math.floor((row + 1) * cellH);
                        
                        let laranjaCount = 0;
                        let brancoCount = 0;
                        let totalPixels = 0;
                        
                        // Analisa cada célula
                        for (let y = startY; y < endY; y++) {
                            for (let x = startX; x < endX; x++) {
                                let i = (y * w + x) * 4;
                                let r = data[i];
                                let g = data[i + 1];
                                let b = data[i + 2];
                                
                                // Número laranja: R alto, G médio, B baixo
                                if (r > 160 && g > 70 && g < 200 && b < 130) {
                                    laranjaCount++;
                                    // Pinta de VERMELHO PURO
                                    out[i] = 255;
                                    out[i + 1] = 0;
                                    out[i + 2] = 0;
                                    out[i + 3] = 255;
                                } 
                                // Círculo branco
                                else if (r > 180 && g > 180 && b > 180) {
                                    brancoCount++;
                                    // Pinta de BRANCO PURO
                                    out[i] = 255;
                                    out[i + 1] = 255;
                                    out[i + 2] = 255;
                                    out[i + 3] = 255;
                                } 
                                // Fundo laranja
                                else {
                                    // Pinta de PRETO PURO
                                    out[i] = 0;
                                    out[i + 1] = 0;
                                    out[i + 2] = 0;
                                    out[i + 3] = 255;
                                }
                                totalPixels++;
                            }
                        }
                        
                        // Se tem mais de 2% de laranja na célula = tem número
                        if (laranjaCount / totalPixels > 0.02) {
                            let idx = row * gridX + col;
                            numeros.push(mapaNumeros[idx].toString().padStart(2, '0'));
                        }
                    }
                }
                
                ctxProc.putImageData(outputData, 0, 0);
                canvasProcessada.style.display = 'block';
                
                if (numeros.length === 0) {
                    status.className = 'erro';
                    status.innerText = '❌ Não detectei números. Corta só o quadrado laranja.';
                    return;
                }
                
                numerosExtraidos = numeros.sort((a,b) => parseInt(a) - parseInt(b)).join(', ');
                resultado.innerText = numerosExtraidos;
                resultado.style.display = 'block';
                btnCopiar.style.display = 'block';
                
                status.className = 'sucesso';
                status.innerText = `✅ ${numeros.length} números extraídos!`;
            };
            img.src = preview.src;
        });
        
        btnCopiar.addEventListener('click', () => {
            navigator.clipboard.writeText(numerosExtraidos);
            btnCopiar.innerText = '✅ Copiado!';
            setTimeout(() => {
                btnCopiar.innerText = '📋 Copiar Números';
            }, 2000);
        });
    </script>
</body>
</html>
