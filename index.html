<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extrator Auto-Corte</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #000;
            color: #fff;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 { text-align: center; margin-bottom: 20px; color: #ff0000; }
        
        #upload-area {
            background: #111;
            border: 3px dashed #ff0000;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 20px;
        }
        #file-input { display: none; }
        #preview {
            max-width: 100%;
            max-height: 300px;
            margin: 20px auto;
            display: none;
            border-radius: 8px;
            border: 2px solid #ff0000;
        }
        #canvasProcessada {
            max-width: 100%;
            margin: 20px auto;
            display: none;
            border-radius: 8px;
            border: 2px solid #00ff00;
        }
        #canvas { display: none; }
        
        button {
            width: 100%;
            padding: 18px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px 0;
        }
        #btnExtrair { background: #ff0000; display: none; }
        #btnCopiar { background: #00aa00; display: none; }
        
        #status {
            text-align: center;
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
            font-weight: bold;
            display: none;
        }
        #status.sucesso { background: #27ae60; display: block; }
        #status.erro { background: #e74c3c; display: block; }
        #status.info { background: #f39c12; color: #000; display: block; }
        
        #resultado {
            background: #111;
            border: 2px solid #ff0000;
            border-radius: 8px;
            padding: 15px;
            min-height: 100px;
            font-size: 18px;
            line-height: 1.8;
            word-break: break-all;
            display: none;
            color: #ff0000;
            font-weight: bold;
        }
        
.info {
            background: #111;
            padding: 12px;
            border-radius: 8px;
            margin: 15px 0;
            font-size: 14px;
            text-align: center;
            border: 1px solid #ff0000;
        }
    </style>
</head>
<body>
    <h1>🔴 Extrator Auto-Corte V12.0</h1>
    
    <div class="info">
        V12.0 - Detecta o quadrado laranja sozinho. Manda print da tela inteira que funciona.
    </div>
    
    <div id="upload-area">
        <div style="font-size: 48px; margin-bottom: 10px;">📁</div>
        <div style="font-size: 18px; font-weight: bold;">Manda o print da tela inteira</div>
        <div style="font-size: 14px; color: #aaa; margin-top: 8px;">Ele corta o laranja sozinho</div>
    </div>
    
    <input type="file" id="file-input" accept="image/*">
    <img id="preview">
    <canvas id="canvas"></canvas>
    <canvas id="canvasProcessada"></canvas>
    
    <button id="btnExtrair">🔍 Auto-Cortar + Extrair</button>
    
    <div id="status"></div>
    
    <div id="resultado"></div>
    <button id="btnCopiar">📋 Copiar Números</button>

    <script>
        const uploadArea = document.getElementById('upload-area');
        const fileInput = document.getElementById('file-input');
        const preview = document.getElementById('preview');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const canvasProcessada = document.getElementById('canvasProcessada');
        const ctxProc = canvasProcessada.getContext('2d');
        const btnExtrair = document.getElementById('btnExtrair');
        const status = document.getElementById('status');
        const resultado = document.getElementById('resultado');
        const btnCopiar = document.getElementById('btnCopiar');
        
        let numerosExtraidos = '';
        
        uploadArea.addEventListener('click', () => fileInput.click());
        
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (e) => {
                preview.src = e.target.result;
                preview.style.display = 'block';
                btnExtrair.style.display = 'block';
                canvasProcessada.style.display = 'none';
                resultado.style.display = 'none';
                btnCopiar.style.display = 'none';
                status.style.display = 'none';
            };
            reader.readAsDataURL(file);
        });
        
        // Padrões melhorados pra dígitos distorcidos
        const DIGITOS = {
            '01110100011000101110': '0',
            '00100010001000100010': '1',
            '11100001001111': '2',
            '11100001001100001111': '3',
            '1001010010111100100': '4',
            '11110100001110001111': '5',
            '01110100001111010111': '6',
            '11100010001000100010': '7',
            '01110101001110101110': '8',
            '01110101001110001110': '9'
        };
        
        function reconhecerDigito(imgData, x, y, w, h) {
            let matriz = '';
            let stepY = h / 5;
            let stepX = w / 4; // 4 colunas pra pegar dígito melhor
            
            for (let row = 0; row < 5; row++) {
                for (let col = 0; col < 4; col++) {
                    let laranja = 0;
                    let total = 0;
                    for (let dy = 0; dy < stepY; dy++) {
                        for (let dx = 0; dx < stepX; dx++) {
                            let px = Math.floor(x + col * stepX + dx);
                            let py = Math.floor(y + row * stepY + dy);
                            if (px >= 0 && px < imgData.width && py >= 0 && py < imgData.height) {
                                let i = (py * imgData.width + px) * 4;
                                let r = imgData.data[i];
                                let g = imgData.data[i + 1];
                                let b = imgData.data[i + 2];
                                if (r > 140 && g < 180 && b < 140) laranja++;
                                total++;
                            }
                        }
                    }
                    matriz += (laranja / total > 0.25)? '1' : '0';
                }
            }
            return DIGITOS[matriz] || '?';
        }
        
        btnExtrair.addEventListener('click', () => {
            status.className = 'info';
            status.innerText = 'Procurando quadrado laranja...';
            
            const img = new Image();
            img.onload = () => {
                // 1. Acha o quadrado laranja na tela inteira
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);
                let imgData = ctx.getImageData(0, 0, img.width, img.height);
                let data = imgData.data;
                
                let minX = img.width, maxX = 0, minY = img.height, maxY = 0;
                let achouLaranja = false;
                
                for (let y = 0; y < img.height; y++) {
                    for (let x = 0; x < img.width; x++) {
                        let i = (y * img.width + x) * 4;
                        let r = data[i], g = data[i+1], b = data[i+2];
                        // Laranja do fundo
                        if (r > 180 && g > 80 && g < 180 && b < 100) {
                            achouLaranja = true;
                            minX = Math.min(minX, x);
                            maxX = Math.max(maxX, x);
                            minY = Math.min(minY, y);
                            maxY = Math.max(maxY, y);
                        }
                    }
                }
                
                if (!achouLaranja) {
                    status.className = 'erro';
                    status.innerText = '❌ Não achei quadrado laranja na imagem';
                    return;
                }
                
                // 2. Recorta só o quadrado laranja
                let cropW = maxX - minX;
                let cropH = maxY - minY;
                let cropData = ctx.getImageData(minX, minY, cropW, cropH);
                
                // 3. Redimensiona pra 400x500 pra manter proporção
                canvas.width = 400;
                canvas.height = 500;
                ctx.putImageData(cropData, 0, 0);
                ctx.drawImage(canvas, 0, 0, cropW, cropH, 0, 0, 400, 500);
                
                let imageData = ctx.getImageData(0, 0, 400, 500);
                data = imageData.data;
                
                canvasProcessada.width = 400;
                canvasProcessada.height = 500;
                let outputData = ctxProc.createImageData(400, 500);
                let out = outputData.data;
                
                let numeros = [];
                let gridX = 4, gridY = 5;
                let cellW = 400 / gridX, cellH = 500 / gridY;
                
                for (let row = 0; row < gridY; row++) {
                    for (let col = 0; col < gridX; col++) {
                        let startX = Math.floor(col * cellW);
                        let startY = Math.floor(row * cellH);
                        let endX = Math.floor((col + 1) * cellW);
                        let endY = Math.floor((row + 1) * cellH);
                        
                        let temLaranja = false;
                        let digitMinX = endX, digitMaxX = startX, digitMinY = endY, digitMaxY = startY;
                        
                        for (let y = startY; y < endY; y++) {
                            for (let x = startX; x < endX; x++) {
                                let i = (y * 400 + x) * 4;
                                let r = data[i], g = data[i+1], b = data[i+2];
                                
                                if (r > 160 && g > 70 && g < 200 && b < 130) {
                                    temLaranja = true;
                                    out[i] = 255; out[i+1] = 0; out[i+2] = 0; out[i+3] = 255;
                                    digitMinX = Math.min(digitMinX, x);
                                    digitMaxX = Math.max(digitMaxX, x);
                                    digitMinY = Math.min(digitMinY, y);
                                    digitMaxY = Math.max(digitMaxY, y);
                                } else if (r > 180 && g > 180 && b > 180) {
                                    out[i] = 255; out[i+1] = 255; out[i+2] = 255; out[i+3] = 255;
                                } else {
                                    out[i] = 0; out[i+1] = 0; out[i+2] = 0; out[i+3] = 255;
                                }
                            }
                        }
                        
                        if (temLaranja) {
                            let dW = digitMaxX - digitMinX;
                            let dH = digitMaxY - digitMinY;
                            
                            // Dois dígitos se largura > 60% da altura
                            if (dW > dH * 0.6) {
                                let d1 = reconhecerDigito(imageData, digitMinX, digitMinY, dW/2, dH);
                                let d2 = reconhecerDigito(imageData, digitMinX + dW/2, digitMinY, dW/2, dH);
                                if (d1!== '?' && d2!== '?') numeros.push(d1 + d2);
                            } else {
                                let d = reconhecerDigito(imageData, digitMinX, digitMinY, dW, dH);
                                if (d!== '?') numeros.push('0' + d);
                            }
                        }
                    }
                }
                
                ctxProc.putImageData(outputData, 0, 0);
                canvasProcessada.style.display = 'block';
                
                if (numeros.length === 0) {
                    status.className = 'erro';
                    status.innerText = '❌ Não consegui ler os números';
                    return;
                }
                
                numerosExtraidos = numeros.sort((a,b) => parseInt(a) - parseInt(b)).join(', ');
                resultado.innerText = numerosExtraidos;
                resultado.style.display = 'block';
                btnCopiar.style.display = 'block';
                
                status.className = 'sucesso';
                status.innerText = `✅ ${numeros.length} números lidos do quadrado laranja!`;
            };
            img.src = preview.src;
        });
        
        btnCopiar.addEventListener('click', () => {
            navigator.clipboard.writeText(numerosExtraidos);
            btnCopiar.innerText = '✅ Copiado!';
            setTimeout(() => {
                btnCopiar.innerText = '📋 Copiar Números';
            }, 2000);
        });
    </script>
</body>
</html>
