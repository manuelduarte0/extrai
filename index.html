<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extrator Densidade</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #000;
            color: #fff;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 { text-align: center; margin-bottom: 20px; color: #ff0000; }
        
        #upload-area {
            background: #111;
            border: 3px dashed #ff0000;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 20px;
        }
        #file-input { display: none; }
        #preview {
            max-width: 100%;
            max-height: 300px;
            margin: 20px auto;
            display: none;
            border-radius: 8px;
            border: 2px solid #ff0000;
        }
        #canvasProcessada {
            max-width: 100%;
            margin: 20px auto;
            display: none;
            border-radius: 8px;
            border: 2px solid #00ff00;
        }
        #canvas { display: none; }
        
        button {
            width: 100%;
            padding: 18px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px 0;
        }
        #btnExtrair { background: #ff0000; display: none; }
        #btnCopiar { background: #00aa00; display: none; }
        
        #status {
            text-align: center;
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
            font-weight: bold;
            display: none;
        }
        #status.sucesso { background: #27ae60; display: block; }
        #status.erro { background: #e74c3c; display: block; }
        #status.info { background: #f39c12; color: #000; display: block; }
        
        #resultado {
            background: #111;
            border: 2px solid #ff0000;
            border-radius: 8px;
            padding: 15px;
            min-height: 100px;
            font-size: 18px;
            line-height: 1.8;
            word-break: break-all;
            display: none;
            color: #ff0000;
            font-weight: bold;
        }
        
.info {
            background: #111;
            padding: 12px;
            border-radius: 8px;
            margin: 15px 0;
            font-size: 14px;
            text-align: center;
            border: 1px solid #ff0000;
        }
    </style>
</head>
<body>
    <h1>🔴 Extrator V17.2 - DENSIDADE</h1>
    
    <div class="info">
        V17.2 - Bug [object Object] corrigido. Lê por densidade + posição do furo.
    </div>
    
    <div id="upload-area">
        <div style="font-size: 48px; margin-bottom: 10px;">📁</div>
        <div style="font-size: 18px; font-weight: bold;">Manda imagem só do grid laranja</div>
        <div style="font-size: 14px; color: #aaa; margin-top: 8px;">Recorta igual a imagem que tu mandou</div>
    </div>
    
    <input type="file" id="file-input" accept="image/*">
    <img id="preview">
    <canvas id="canvas"></canvas>
    <canvas id="canvasProcessada"></canvas>
    
    <button id="btnExtrair">🔍 Extrair Números</button>
    
    <div id="status"></div>
    
    <div id="resultado"></div>
    <button id="btnCopiar">📋 Copiar Números</button>

    <script>
        const uploadArea = document.getElementById('upload-area');
        const fileInput = document.getElementById('file-input');
        const preview = document.getElementById('preview');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const canvasProcessada = document.getElementById('canvasProcessada');
        const ctxProc = canvasProcessada.getContext('2d');
        const btnExtrair = document.getElementById('btnExtrair');
        const status = document.getElementById('status');
        const resultado = document.getElementById('resultado');
        const btnCopiar = document.getElementById('btnCopiar');
        
        let numerosExtraidos = '';
        
        uploadArea.addEventListener('click', () => fileInput.click());
        
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (e) => {
                preview.src = e.target.result;
                preview.style.display = 'block';
                btnExtrair.style.display = 'block';
                canvasProcessada.style.display = 'none';
                resultado.style.display = 'none';
                btnCopiar.style.display = 'none';
                status.style.display = 'none';
            };
            reader.readAsDataURL(file);
        });
        
        // DENSIDADE + FURO - FUNCIONA PRA ESSA FONTE GORDA
        function readDigit(data, w, minX, maxX, minY, maxY) {
            let dW = maxX - minX;
            let dH = maxY - minY;
            if (dW < 3 || dH < 5) return '?';
            
            let pixels = 0, total = 0;
            let furoCima = 0, furoBaixo = 0, furoMeio = 0;
            
            for (let y = minY; y < maxY; y++) {
                for (let x = minX; x < maxX; x++) {
                    let i = (y * w + x) * 4;
                    let r = data[i], g = data[i+1], b = data[i+2];
                    let isOrange = r > 90 && g > 20 && g < 240 && b < 190 && (r - b) > 10;
                    
                    total++;
                    if (isOrange) pixels++;
                    
                    // Detecta furos
                    let relY = (y - minY) / dH;
                    let relX = (x - minX) / dW;
                    if (!isOrange) {
                        if (relY > 0.2 && relY < 0.4 && relX > 0.3 && relX < 0.7) furoCima++;
                        if (relY > 0.6 && relY < 0.8 && relX > 0.3 && relX < 0.7) furoBaixo++;
                        if (relY > 0.4 && relY < 0.6 && relX > 0.3 && relX < 0.7) furoMeio++;
                    }
                }
            }
            
            let dens = pixels / total;
            let temFuroCima = furoCima > total * 0.01;
            let temFuroBaixo = furoBaixo > total * 0.01;
            let temFuroMeio = furoMeio > total * 0.005;
            
            // Classificação por densidade + furos - CALIBRADO PRA ESSA FONTE
            if (dens < 0.25) return '1';
            if (dens > 0.6) return '8';
            if (dens > 0.5 && dens < 0.6) {
                if (temFuroCima &&!temFuroBaixo) return '9';
                if (!temFuroCima && temFuroBaixo) return '6';
                return '0';
            }
            if (dens > 0.4 && dens < 0.5) {
                if (temFuroMeio) return '4';
                if (temFuroCima) return '9';
                return '3';
            }
            if (dens > 0.35 && dens < 0.4) {
                if (temFuroBaixo) return '5';
                return '2';
            }
            if (dens > 0.25 && dens < 0.35) return '7';
            
            return '?';
        }
        
        function isLaranjaTexto(r, g, b) {
            return r > 90 && g > 20 && g < 240 && b < 190 && (r - b) > 10;
        }
        
        btnExtrair.addEventListener('click', () => {
            status.className = 'info';
            status.innerText = 'Lendo por densidade...';
            
            const img = new Image();
            img.onload = () => {
                let w = img.width;
                let h = img.height;
                
                canvas.width = w;
                canvas.height = h;
                ctx.drawImage(img, 0, 0);
                let imgData = ctx.getImageData(0, 0, w, h);
                let data = imgData.data;
                
                canvasProcessada.width = w;
                canvasProcessada.height = h;
                let outputData = ctxProc.createImageData(w, h);
                let out = outputData.data;
                
                let numeros = [];
                let gridX = 4, gridY = 5;
                let cellW = w / gridX;
                let cellH = h / gridY;
                
                for (let row = 0; row < gridY; row++) {
                    for (let col = 0; col < gridX; col++) {
                        let startX = Math.floor(col * cellW);
                        let endX = Math.floor((col + 1) * cellW);
                        let startY = Math.floor(row * cellH);
                        let endY = Math.floor((row + 1) * cellH);
                        
                        let temTexto = false;
                        let digitBounds = {minX: endX, maxX: startX, minY: endY, maxY: startY};
                        
                        for (let y = startY; y < endY; y++) {
                            for (let x = startX; x < endX; x++) {
                                let i = (y * w + x) * 4;
                                let r = data[i], g = data[i+1], b = data[i+2];
                                
                                if (isLaranjaTexto(r, g, b)) {
                                    temTexto = true;
                                    out[i] = 255; out[i+1] = 0; out[i+2] = 0; out[i+3] = 255;
                                    digitBounds.minX = Math.min(digitBounds.minX, x);
                                    digitBounds.maxX = Math.max(digitBounds.maxX, x);
                                    digitBounds.minY = Math.min(digitBounds.minY, y);
                                    digitBounds.maxY = Math.max(digitBounds.maxY, y);
                                } else if (r > 180 && g > 180 && b > 180) {
                                    out[i] = 255; out[i+1] = 255; out[i+2] = 255; out[i+3] = 255;
                                } else {
                                    out[i] = 0; out[i+1] = 0; out[i+2] = 0; out[i+3] = 255;
                                }
                            }
                        }
                        
                        if (temTexto) {
                            let dW = digitBounds.maxX - digitBounds.minX;
                            let dH = digitBounds.maxY - digitBounds.minY;
                            if (dW < 2 || dH < 4) continue;
                            
                            if (dW > dH * 0.55) {
                                let mid = digitBounds.minX + dW / 2;
                                let d1 = readDigit(data, w, digitBounds.minX, mid, digitBounds.minY, digitBounds.maxY);
                                let d2 = readDigit(data, w, mid, digitBounds.maxX, digitBounds.minY, digitBounds.maxY);
                                if (d1!== '?' && d2!== '?') numeros.push(d1 + d2);
                            } else {
                                let d = readDigit(data, w, digitBounds.minX, digitBounds.maxX, digitBounds.minY, digitBounds.maxY);
                                if (d!== '?') numeros.push('0' + d);
                            }
                        }
                    }
                }
                
                ctxProc.putImageData(outputData, 0, 0);
                canvasProcessada.style.display = 'block';
                
                if (numeros.length === 0) {
                    status.className = 'erro';
                    status.innerText = '❌ Não achei números laranja';
                    return;
                }
                
                numerosExtraidos = numeros.sort((a,b) => parseInt(a) - parseInt(b)).join(', ');
                resultado.innerText = numerosExtraidos;
                resultado.style.display = 'block';
                btnCopiar.style.display = 'block';
                
                status.className = 'sucesso';
                status.innerText = `✅ ${numeros.length} números extraídos!`;
            };
            img.src = preview.src;
        });
        
        btnCopiar.addEventListener('click', () => {
            navigator.clipboard.writeText(numerosExtraidos);
            btnCopiar.innerText = '✅ Copiado!';
            setTimeout(() => {
                btnCopiar.innerText = '📋 Copiar Números';
            }, 2000);
        });
    </script>
</body>
</html>
