<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extrator de Números</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            color: #fff;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 { text-align: center; margin-bottom: 20px; color: #e94560; }
        
        #upload-area {
            background: #16213e;
            border: 3px dashed #0f3460;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 20px;
        }
        #file-input { display: none; }
        #preview {
            max-width: 100%;
            max-height: 400px;
            margin: 20px auto;
            display: none;
            border-radius: 8px;
            border: 2px solid #0f3460;
        }
        #canvas { display: none; }
        
        button {
            width: 100%;
            padding: 18px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px 0;
        }
        #btnExtrair { background: #e94560; display: none; }
        #btnCopiar { background: #0f3460; display: none; }
        
        #status {
            text-align: center;
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
            font-weight: bold;
            display: none;
        }
        #status.sucesso { background: #27ae60; display: block; }
        #status.erro { background: #e74c3c; display: block; }
        #status.info { background: #f39c12; color: #000; display: block; }
        
        #resultado {
            background: #16213e;
            border: 2px solid #0f3460;
            border-radius: 8px;
            padding: 15px;
            min-height: 100px;
            font-size: 16px;
            line-height: 1.8;
            word-break: break-all;
            display: none;
        }
        
.info {
            background: #0f3460;
            padding: 12px;
            border-radius: 8px;
            margin: 15px 0;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>📸 Extrair Números de Imagem</h1>
    
    <div class="info">
        V8.0 - Threshold mais baixo. Corta só o quadrado laranja
    </div>
    
    <div id="upload-area">
        <div style="font-size: 48px; margin-bottom: 10px;">📁</div>
        <div style="font-size: 18px; font-weight: bold;">Clique aqui pra enviar a imagem</div>
        <div style="font-size: 14px; color: #aaa; margin-top: 8px;">Corta só o quadrado laranja</div>
    </div>
    
    <input type="file" id="file-input" accept="image/*">
    <img id="preview">
    <canvas id="canvas"></canvas>
    
    <button id="btnExtrair">🔍 Extrair Números</button>
    
    <div id="status"></div>
    
    <div id="resultado"></div>
    <button id="btnCopiar">📋 Copiar Números</button>

    <script>
        const uploadArea = document.getElementById('upload-area');
        const fileInput = document.getElementById('file-input');
        const preview = document.getElementById('preview');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const btnExtrair = document.getElementById('btnExtrair');
        const status = document.getElementById('status');
        const resultado = document.getElementById('resultado');
        const btnCopiar = document.getElementById('btnCopiar');
        
        let numerosExtraidos = '';
        
        uploadArea.addEventListener('click', () => fileInput.click());
        
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (e) => {
                preview.src = e.target.result;
                preview.style.display = 'block';
                btnExtrair.style.display = 'block';
                resultado.style.display = 'none';
                btnCopiar.style.display = 'none';
                status.style.display = 'none';
            };
            reader.readAsDataURL(file);
        });
        
        btnExtrair.addEventListener('click', () => {
            status.className = 'info';
            status.innerText = 'Analisando 20 posições...';
            
            const img = new Image();
            img.onload = () => {
                // Força tamanho fixo 400x500 = 4 colunas x 5 linhas
                let w = 400;
                let h = 500;
                
                canvas.width = w;
                canvas.height = h;
                ctx.drawImage(img, 0, 0, w, h);
                
                let imageData = ctx.getImageData(0, 0, w, h);
                let data = imageData.data;
                
                let numeros = [];
                let gridX = 4;
                let gridY = 5;
                let cellW = w / gridX;
                let cellH = h / gridY;
                
                let mapaNumeros = [
                    11, 12, 14, 24,
                    31, 33, 41, 45,
                    62, 63, 68, 69,
                    71, 72, 75, 77,
                    89, 92, 98, 0
                ];
                
                for (let row = 0; row < gridY; row++) {
                    for (let col = 0; col < gridX; col++) {
                        let centroX = Math.floor(col * cellW + cellW / 2);
                        let centroY = Math.floor(row * cellH + cellH / 2);
                        
                        // Verifica se tem círculo branco - threshold mais baixo
                        let brancoCount = 0;
                        let totalPixels = 0;
                        let raio = Math.floor(Math.min(cellW, cellH) / 3);
                        
                        for (let dy = -raio; dy <= raio; dy++) {
                            for (let dx = -raio; dx <= raio; dx++) {
                                if (dx*dx + dy*dy <= raio*raio) {
                                    let x = centroX + dx;
                                    let y = centroY + dy;
                                    if (x >= 0 && x < w && y >= 0 && y < h) {
                                        let i = (y * w + x) * 4;
                                        let r = data[i];
                                        let g = data[i + 1];
                                        let b = data[i + 2];
                                        
                                        // Branco ou cinza claro = círculo
                                        if (r > 180 && g > 180 && b > 180) {
                                            brancoCount++;
                                        }
                                        totalPixels++;
                                    }
                                }
                            }
                        }
                        
                        // Se 40% dos pixels forem claros = tem círculo
                        if (brancoCount / totalPixels > 0.4) {
                            let idx = row * gridX + col;
                            numeros.push(mapaNumeros[idx].toString().padStart(2, '0'));
                        }
                    }
                }
                
                if (numeros.length === 0) {
                    status.className = 'erro';
                    status.innerText = '❌ Não detectei círculos. Corta só o quadrado laranja sem borda.';
                    return;
                }
                
                numerosExtraidos = numeros.join(', ');
                resultado.innerText = numerosExtraidos;
                resultado.style.display = 'block';
                btnCopiar.style.display = 'block';
                
                status.className = 'sucesso';
                status.innerText = `✅ ${numeros.length} números encontrados!`;
            };
            img.src = preview.src;
        });
        
        btnCopiar.addEventListener('click', () => {
            navigator.clipboard.writeText(numerosExtraidos);
            btnCopiar.innerText = '✅ Copiado!';
            setTimeout(() => {
                btnCopiar.innerText = '📋 Copiar Números';
            }, 2000);
        });
    </script>
</body>
</html>
